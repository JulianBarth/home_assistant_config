# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Lovelace UI configuration
lovelace:
  resource_mode: yaml
  resources:
    - url: /local/energy-flow-card.js?v=20261016-2
      type: module
    - url: /hacsfiles/ha-sankey-chart/ha-sankey-chart.js
      type: module
    - url: /hacsfiles/power-flow-card-plus/power-flow-card-plus.js
      type: module
    # Future-price/forecast charts — install "apexcharts-card" via HACS
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
  dashboards:
    energy-overview:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Home energy
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Helper
# NOTE: no `initial:` on helpers — HA would reset them to that value on every
# restart, silently wiping UI-tuned parameters. Values now persist via restore.
input_boolean:
  grid_outage_active:
    name: Confirmed Grid Outage Active
    icon: mdi:transmission-tower-off
  battery_charging_active:
    name: Battery Charging Active
    icon: mdi:battery-charging
  battery_no_discharging_active:
    name: Battery No Discharging
    icon: mdi:battery-lock
  battery_automation_on:
    name: Battery Charge Automation is On
    icon: mdi:state-machine
  manual_battery_charge:
    name: Manual Battery Charge

  # Car smart charging (solar-backed boost + cheap grid windows)
  car_smart_charging_on:
    name: Car Smart Charging Automation is On
    icon: mdi:car-electric
  car_boost_active:
    name: Car Solar-Backed Boost Active
    icon: mdi:car-turbocharger
  car_cheap_grid_active:
    name: Car Cheap Grid Charging Active
    icon: mdi:cash-clock
  car_boost_suppressed:
    name: Car Boost Suppressed Until Replug
    icon: mdi:car-off
  # "A boost session the user has been told about is in play." Set when a boost
  # start notification is actually sent, cleared by the session summary — so
  # every start notification gets exactly one matching wrap-up, and the
  # start/stop churn in between stays silent.
  car_boost_notified:
    name: Car Boost Start Notification Sent
    icon: mdi:bell-check

# Set by the Grid Outage Guard when an island is detected; survives HA
# restarts (unlike entity last_changed) so the restore notification can
# report the real outage duration even if HA rebooted mid-outage
input_datetime:
  grid_outage_start:
    name: Grid Outage Started
    has_date: true
    has_time: true
    icon: mdi:transmission-tower-off

  # Throttle reference for boost start notifications (see
  # input_number.car_boost_notify_throttle_min)
  car_boost_last_notify:
    name: Car Boost Last Notification
    has_date: true
    has_time: true
    icon: mdi:bell-outline

input_number:
  battery_target_soc:
    name: Battery Target SoC
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  manual_charge_target_soc:
    name: Manual Charge Target SoC
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

  sun_threshold_low:
    name: Expected Sun Low Threshold
    min: 0
    max: 50000
    step: 1000
    unit_of_measurement: "Wh"

  sun_threshold_very_low:
    name: Expected Sun Very Low Threshold
    min: 0
    max: 50000
    step: 1000
    unit_of_measurement: "Wh"

  soc_target_default:
    name: Default Target SoC
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

  soc_hist:
    name: SoC Hysteresis
    step: 0.5
    min: 0
    max: 25
    icon: mdi:thermometer

  # Grid capacity setting
  grid_connection_capacity:
    name: Grid Connection Capacity
    min: 5000
    max: 50000
    step: 1000
    unit_of_measurement: "W"
    icon: mdi:transmission-tower

  # Battery parameters
  battery_charge_rate_max:
    name: Maximum Battery Charge Rate
    min: 1000
    max: 10000
    step: 500
    unit_of_measurement: "W"
    icon: mdi:lightning-bolt

  # Economic parameters
  battery_wear_cost_per_kwh:
    name: Battery Wear Cost
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: "Cent/kWh"
    icon: mdi:cash-minus

  # Hysteresis parameters
  battery_hold_threshold:
    name: Battery Hold Threshold
    min: 1
    max: 10
    step: 0.5
    unit_of_measurement: "%"
    icon: mdi:arrow-split-horizontal

  car_charging_hysteresis_minutes:
    name: Car Charging State Hysteresis
    min: 0
    max: 15
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline

  # Battery capacity for solar-to-SoC calculations
  battery_capacity_wh:
    name: Battery Capacity
    min: 1000
    max: 50000
    step: 100
    unit_of_measurement: "Wh"
    icon: mdi:battery-high

  night_consumption_rate_wh:
    name: Night Consumption Rate (22:00-wake)
    min: 50
    max: 600
    step: 10
    unit_of_measurement: "Wh/h"
    icon: mdi:sleep

  day_consumption_rate_wh:
    name: Day Consumption Rate (wake-22:00)
    min: 200
    max: 2000
    step: 10
    unit_of_measurement: "Wh/h"
    icon: mdi:run

  weekday_wake_hour:
    name: Weekday Wake Hour
    min: 0
    max: 12
    step: 0.5
    unit_of_measurement: "h"
    icon: mdi:alarm

  weekend_wake_hour:
    name: Weekend Wake Hour
    min: 0
    max: 12
    step: 0.5
    unit_of_measurement: "h"
    icon: mdi:alarm-snooze

  sleep_hour:
    name: Sleep Hour (High→Low Consumption)
    min: 18
    max: 24
    step: 0.5
    unit_of_measurement: "h"
    icon: mdi:power-sleep

  # Low solar threshold for winter mode detection
  low_solar_threshold_wh:
    name: Low Solar Forecast Threshold
    min: 500
    max: 10000
    step: 500
    unit_of_measurement: "Wh"
    icon: mdi:weather-sunny-off

  # Surplus discharge policy: only spends battery energy that is unlikely to be
  # needed by the house before solar production recovers.
  battery_surplus_safety_margin_wh:
    name: Battery Surplus Safety Margin
    min: 0
    max: 3000
    step: 100
    unit_of_measurement: "Wh"
    icon: mdi:shield-battery

  battery_surplus_extra_discharge_cap_w:
    name: Battery Surplus Extra Discharge Cap
    min: 0
    max: 3000
    step: 100
    unit_of_measurement: "W"
    icon: mdi:battery-arrow-down

  # Car smart charging parameters (recommended values in CAR_SMART_CHARGING.md —
  # helpers start at `min` on first deploy, so every `min` here must be a SAFE
  # value: the 2026-07-03 deploy left min_soc at 10 and min_budget at 500, which
  # allowed the 2026-07-07 midnight boost to run on a 500 Wh budget)
  car_boost_min_soc:
    name: Car Boost Battery Floor SoC
    min: 20
    max: 60
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-30

  # Boost floor while the grid is DOWN (Inselbetrieb): the battery is the only
  # night supply, so a boost may only lend energy above this much higher floor.
  # Helpers start at `min` on first deploy — 60 is already a safe reserve.
  car_boost_island_floor_soc:
    name: Car Boost Island Floor SoC
    min: 60
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:transmission-tower-off

  car_boost_min_budget_wh:
    name: Car Boost Minimum Start Budget
    min: 1000
    max: 10000
    step: 100
    unit_of_measurement: "Wh"
    icon: mdi:battery-plus-variant

  # Added to the boost floor before it is written to the Wattpilot stop and used
  # in the budget: compensates the BMS reading its SoC ~10-15 %-points too high
  # under a ~4 kW discharge (see CAR_SMART_CHARGING.md, incident 2026-07-07)
  car_boost_floor_margin_pct:
    name: Car Boost Floor Load Margin
    min: 10
    max: 25
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-alert

  car_boost_solar_confidence_pct:
    name: Car Boost Solar Forecast Confidence
    min: 30
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:weather-sunny-alert

  car_boost_charging_current_a:
    name: Car Boost Charging Current
    min: 6
    max: 16
    step: 1
    unit_of_measurement: "A"
    icon: mdi:current-ac

  # A boost can start, stop and restart several times inside one sunny hour
  # (Eco takes over, budget dips, inverter data blips). Each cycle used to send
  # its own start + end push. Only the first start in this window is announced;
  # the rest of the session is silent until the wrap-up summary. Helpers start
  # at `min` on first deploy, so `min` must already be a quiet value.
  car_boost_notify_throttle_min:
    name: Car Boost Notification Throttle
    min: 60
    max: 360
    step: 30
    unit_of_measurement: "min"
    icon: mdi:bell-sleep

  car_cheap_grid_percentile:
    name: Car Cheap Grid Start Percentile
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    icon: mdi:percent

  car_cheap_grid_max_price_ct:
    name: Car Cheap Grid Price Ceiling
    min: 0
    max: 40
    step: 1
    unit_of_measurement: "Cent/kWh"
    icon: mdi:cash-lock

sensor:

  - platform: rest
    name: "Tibber Energy Prices"
    resource: https://api.tibber.com/v1-beta/gql
    method: POST
    payload: '{ "query": "{ viewer { homes { currentSubscription { priceInfo(resolution: QUARTER_HOURLY) { current { total startsAt } today { total startsAt } tomorrow { total startsAt } } } } } }" }'
    json_attributes_path: "$.data.viewer.homes[0].currentSubscription.priceInfo"
    json_attributes:
      - today
      - tomorrow
    value_template: "{{ value_json.data.viewer.homes[0].currentSubscription.priceInfo.current.total | float }}"
    # Prices change every 15 min — 5 min polling is plenty (was 30s = 2880 calls/day)
    scan_interval: 300
    headers:
      Authorization: !secret tibber_api_key
      Content-Type: application/json
      User-Agent: REST
    unit_of_measurement: EUR/kWh
  # Riemann Sum Integral Sensors for Energy Dashboard
  - platform: integration
    source: sensor.grid_import_power
    name: grid_import_energy
    unit_prefix: k
    round: 2
    method: left
  - platform: integration
    source: sensor.grid_export_power
    name: grid_export_energy
    unit_prefix: k
    round: 2
    method: left
  - platform: integration
    source: sensor.total_solar_power
    name: solar_energy
    unit_prefix: k
    round: 2
    method: left
  - platform: integration
    source: sensor.battery_charge_power
    name: battery_charge_energy
    unit_prefix: k
    round: 2
    method: left
  - platform: integration
    source: sensor.battery_discharge_power
    name: battery_discharge_energy
    unit_prefix: k
    round: 2
    method: left
  # Smooth house load feeding the discharge-limit calc so car-power
  # fluctuations don't cause the limit to swing (Fix 4)
  - platform: filter
    name: "House Consumption Smoothed"
    entity_id: sensor.house_consumption
    filters:
      - filter: time_simple_moving_average
        window_size: "00:03:00"
        precision: 0

# Daily solar energy for the sunset forecast-vs-actual log line
utility_meter:
  solar_energy_daily:
    source: sensor.solar_energy
    cycle: daily

# Structured algorithm logging (using command_line integration)
command_line:
  - sensor:
      name: Reutlingen Energy Model
      unique_id: reutlingen_energy_model
      command: >-
        python3 /config/tools/seasonal_model.py --history-root /config --payload '{%- set reserve = states('input_number.soc_target_default') | float(15) -%}
        {%- set floor = ([states('input_number.car_boost_min_soc') | float(30), reserve + 5] | max) + states('input_number.car_boost_floor_margin_pct') | float(10) -%}
        {%- set floor = ([floor, states('input_number.car_boost_island_floor_soc') | float(75)] | max) if is_state('binary_sensor.grid_available', 'off') else floor -%}
        {%- set periods = namespace(rows=[]) -%}
        {%- for row in (state_attr('sensor.solcast_pv_forecast_prognose_heute', 'detailedForecast') or []) + (state_attr('sensor.solcast_pv_forecast_prognose_morgen', 'detailedForecast') or []) -%}
          {%- set period = dict(period_start=row.period_start | string, pv_estimate=row.pv_estimate) -%}
          {%- if row.pv_estimate10 is defined -%}
            {%- set period = dict(period, pv_estimate10=row.pv_estimate10) -%}
          {%- endif -%}
          {%- set periods.rows = periods.rows + [period] -%}
        {%- endfor -%}
        {%- set payload = dict(
          when=now().isoformat(),
          night_rate=states('input_number.night_consumption_rate_wh'),
          day_rate=states('input_number.day_consumption_rate_wh'),
          weekday_wake=states('input_number.weekday_wake_hour'),
          weekend_wake=states('input_number.weekend_wake_hour'),
          sleep_hour=states('input_number.sleep_hour'),
          capacity_wh=states('input_number.battery_capacity_wh'),
          reserve_soc=reserve, soc=(states('sensor.reading_energy_battery_soc_scaled') | float(0) / 100) if is_number(states('sensor.reading_energy_battery_soc_scaled')) else 0, car_floor_soc=floor,
          safety_margin_wh=states('input_number.battery_surplus_safety_margin_wh'),
          low_solar_threshold_wh=states('input_number.low_solar_threshold_wh'),
          solar_confidence_pct=states('input_number.car_boost_solar_confidence_pct'),
          forecast_updated_at=states('sensor.solcast_pv_forecast_zeitpunkt_letzter_api_abruf'),
          today_solar_kwh=states('sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute'),
          tomorrow_solar_kwh=states('sensor.solcast_pv_forecast_prognose_morgen'),
          forecast=periods.rows) -%}
        {{- payload | to_json | base64_encode -}}'
      scan_interval: 300
      command_timeout: 30
      value_template: "{{ value_json.generated_at }}"
      json_attributes:
        - version
        - inputs_ready
        - location
        - timezone
        - forecast_status
        - charge_efficiency
        - discharge_efficiency
        - accepted_history_samples
        - learned_hour_groups
        - calendar
        - battery
        - surplus
        - car
  - notify:
      name: battery_log
      command: "python3 /config/tools/battery_log.py"

# Archive the algorithm log monthly (called by automation on the 1st).
# Archives instead of truncating: the discarded lines are exactly the data
# needed to reconstruct incidents (e.g. 2026-07-07 midnight boost). The label
# is the month that just ended.
shell_command:
  rotate_battery_log: >
    python3 /config/tools/battery_log.py --rotate {{ (now() - timedelta(days=1)).strftime("%Y-%m") }}

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
modbus: !include modbus.yaml
template: !include templates.yaml
