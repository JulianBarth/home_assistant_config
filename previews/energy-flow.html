<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy flow · preview</title><style>body{margin:0;background:#f2f5f1;color:#213631;font-family:system-ui,sans-serif;padding:28px}main{max-width:1080px;margin:auto}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button{font:inherit;border:1px solid #d5dfd7;border-radius:20px;padding:9px 15px;background:white;color:#213631;cursor:pointer}button[aria-pressed=true]{background:#213e34;color:white}p{font-size:12px;color:#677d70}body.dark{background:#141e1c;--primary-text-color:#e5eeea;--secondary-text-color:#a6b8ae;--card-background-color:#1b2925;--divider-color:#35453e;color:#e5eeea}@media(max-width:600px){body{padding:12px}}</style><main><nav aria-label="Preview scenarios"><button data-scene="solar">Solar surplus</button><button data-scene="night">Evening</button><button data-scene="charge">Grid charging</button><button data-scene="idle">Idle</button><button data-scene="missing">Sensor offline</button><button id="theme">Light / dark</button></nav><energy-flow-card></energy-flow-card><p>Design preview · illustrative readings, not live measurements.</p><p id="details"></p></main><script src="../www/energy-flow-card.js"></script><script>
const card=document.querySelector('energy-flow-card');card.setConfig({});
const scenes={solar:[5400,-1800,1600,1200,800,74,4700,700],night:[0,300,-900,1200,0,42,0,0],charge:[0,7200,1400,800,5000,28,0,0],idle:[0,0,0,0,0,55,0,0],missing:['unavailable',300,0,0,0,'unavailable','unavailable',0]};
function show(scene){const values=scenes[scene];const states={};Object.keys(ENERGY_ENTITIES).slice(0,8).forEach((key,i)=>states[ENERGY_ENTITIES[key]]={state:String(values[i]),attributes:{unit_of_measurement:i===5?'%':'W'}});states[ENERGY_ENTITIES.meter]={state:String(values[1])};states[ENERGY_ENTITIES.inverter]={state:String(values[6]==='unavailable'?'unavailable':values[6]-values[2])};states[ENERGY_ENTITIES.car_raw]={state:String(values[4])};states[ENERGY_ENTITIES.validity]={state:scene==='missing'?'off':'on'};card.hass={states};document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>show(b.dataset.scene));document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');card.addEventListener('hass-more-info',e=>document.querySelector('#details').textContent='Sensor details: '+e.detail.entityId);show('solar');
</script></html>
