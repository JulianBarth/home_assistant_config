# Using 15-minute pricing intervals from Tibber API
- alias: "Manual Battery Charging"
  trigger:
    - platform: state
      entity_id: input_boolean.manual_battery_charge
      to: "on"
  action:
    # Just set the flag - let unified coordinator handle the rest
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "🔋 Manual Charging Requested"
        message: >-
          Charging to {{ states('input_number.manual_charge_target_soc') | float(80) | round(0) }}%
          (now {{ states('sensor.batterie_soc') }}%) at
          {{ (states('sensor.tibber_cached_energy_prices') | float(0) * 100) | round(1) }} ct/kWh.
          Automation is overridden until the target is reached.
        data:
          tag: battery_charging
          group: battery

- alias: "Unified Battery Control Coordinator"
  description: "Single automation to coordinate all battery control modes"
  trigger:
    # Trigger on mode changes
    - platform: state
      entity_id: sensor.battery_control_mode
    # Trigger on SoC changes (for stop conditions and hold mode)
    - platform: state
      entity_id:
        - binary_sensor.should_stop_charging
        - binary_sensor.should_hold_battery_soc
        - binary_sensor.should_prevent_discharge
        - sensor.computed_target_soc
    # Fallback check every 5 minutes
    - platform: time_pattern
      minutes: "/5"
  action:
    - choose:
        # Mode 1: Manual Charging (Highest Priority)
        - conditions:
            - condition: state
              entity_id: sensor.battery_control_mode
              state: "manual_charging"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.battery_target_soc
              data:
                value: "{{ states('input_number.manual_charge_target_soc') | float(default=80) }}"
            - service: script.turn_on
              target:
                entity_id: script.forced_full_recharge
            - service: switch.turn_on
              target:
                entity_id: switch.StorCtl_Mod
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.battery_charging_active

        # Mode 2: Car + Battery Charging
        - conditions:
            - condition: state
              entity_id: sensor.battery_control_mode
              state: "car_and_battery_charging"
            - condition: state
              entity_id: binary_sensor.should_stop_charging
              state: "off"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.battery_target_soc
              data:
                value: "{{ states('sensor.computed_target_soc') | float(default=15) }}"
            - service: script.turn_on
              target:
                entity_id: script.charge_battery_limit_discharge

        # Mode 3: Car Charging Only (Limit Discharge)
        - conditions:
            - condition: state
              entity_id: sensor.battery_control_mode
              state: "car_charging_only"
          sequence:
            # House from battery, Car from grid.
            # Limit discharge to exactly match house consumption.
            - service: script.turn_on
              target:
                entity_id: script.set_dynamic_discharge_limit
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.battery_no_discharging_active

        # Mode 4: Battery Charging Only
        - conditions:
            - condition: state
              entity_id: sensor.battery_control_mode
              state: "battery_charging"
            - condition: state
              entity_id: binary_sensor.should_stop_charging
              state: "off"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.battery_target_soc
              data:
                value: "{{ states('sensor.computed_target_soc') | float(default=15) }}"
            - service: script.turn_on
              target:
                entity_id: script.forced_full_recharge
            - service: switch.turn_on
              target:
                entity_id: switch.StorCtl_Mod
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.battery_charging_active

      # Default: Stop Charging, Hold SOC, or Normal Operation
      # NOTE: Fronius handles minimum reserve SoC — HA only manages cost optimization
      default:
        - choose:
            # FIRST: Stop charging when target reached
            - conditions:
                - condition: state
                  entity_id: binary_sensor.should_stop_charging
                  state: "on"
              sequence:
                - service: script.turn_on
                  target:
                    entity_id: script.stop_battery_charging
                - service: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.manual_battery_charge
                # Clear ALL flags — charging cycle complete
                - service: input_boolean.turn_off
                  target:
                    entity_id:
                      - input_boolean.battery_charging_active
                      - input_boolean.battery_no_discharging_active
                # Reset target to default (prevents stale 100% target from previous cycle)
                - service: input_number.set_value
                  target:
                    entity_id: input_number.battery_target_soc
                  data:
                    value: "{{ states('input_number.soc_target_default') | float(default=15) }}"
            # SECOND: Hold SOC when approaching target during active charging
            - conditions:
                - condition: state
                  entity_id: binary_sensor.should_hold_battery_soc
                  state: "on"
              sequence:
                # Use reduced charge rate (50%) to approach target gradually
                - service: script.turn_on
                  target:
                    entity_id: script.charge_battery_reduced_rate
                # Set flag to indicate we're in hold/limited discharge mode
                - service: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.battery_no_discharging_active
            # THIRD: Prevent discharge when at or below target SoC
            - conditions:
                - condition: state
                  entity_id: binary_sensor.should_prevent_discharge
                  state: "on"
              sequence:
                # Limit discharge to 1% to hold SOC, allow solar charging
                - service: script.turn_on
                  target:
                    entity_id: script.hold_battery_soc
                # Set flag to indicate we're in hold/limited discharge mode
                - service: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.battery_no_discharging_active
          # Fully release — no car, no charging needed
          default:
            # Debounce: don't release limits on a brief wallbox flicker — only
            # once car_charging_stable has actually been off for 3+ minutes.
            # The watchdog (Fix 1) keeps re-tightening the limit in the meantime.
            - condition: template
              value_template: >
                {{ is_state('binary_sensor.car_charging_stable', 'off')
                   and (now() - states.binary_sensor.car_charging_stable.last_changed).total_seconds() > 180 }}
            - service: script.turn_on
              target:
                entity_id: script.set_regular_charge
            - service: switch.turn_off
              target:
                entity_id: switch.StorCtl_Mod
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.battery_charging_active
                  - input_boolean.battery_no_discharging_active
            # Reset target to default
            - service: input_number.set_value
              target:
                entity_id: input_number.battery_target_soc
              data:
                value: "{{ states('input_number.soc_target_default') | float(default=15) }}"


# =============================================================================
# ALGORITHM STATE LOGGER
# Writes a JSON line to /config/battery_algorithm.log every 15 min and on events
# =============================================================================
- alias: "Battery Algorithm State Logger"
  description: "Logs full algorithm state as JSON for offline analysis"
  trigger:
    # Periodic: every 15 minutes
    - platform: time_pattern
      minutes: "/15"
      id: periodic
    # Event-based triggers
    - platform: state
      entity_id: input_boolean.battery_charging_active
      id: charging_flag_changed
    - platform: state
      entity_id: input_boolean.battery_no_discharging_active
      id: discharge_flag_changed
    - platform: state
      entity_id: binary_sensor.should_start_charging
      to: "on"
      id: should_start
    - platform: state
      entity_id: binary_sensor.should_stop_charging
      to: "on"
      id: should_stop
    - platform: state
      entity_id: sensor.battery_control_mode
      id: mode_changed
  action:
    - service: notify.battery_log
      data:
        message: >
          {% set data = state_attr('sensor.battery_optimization_data', 'calculation_data') %}
          {% set cached_today = state_attr('sensor.tibber_cached_energy_prices', 'today') or [] %}
          {% set cached_tomorrow = state_attr('sensor.tibber_cached_energy_prices', 'tomorrow') or [] %}
          {% set raw_today = state_attr('sensor.tibber_energy_prices', 'today') or [] %}
          {% set raw_tomorrow = state_attr('sensor.tibber_energy_prices', 'tomorrow') or [] %}
          {"schema":2,"ts":"{{ now().isoformat() }}","trigger":"{{ trigger.id | default('unknown') }}","soc":{{ states('sensor.batterie_soc') | float(0) }},"soc_scaled":{{ states('sensor.reading_energy_battery_soc_scaled') | float(0) }},"target":{{ states('input_number.battery_target_soc') | float(15) }},"computed_target":{{ states('sensor.computed_target_soc') | float(15) }},"mode":"{{ states('sensor.battery_control_mode') }}","charging_state":"{{ states('sensor.charging_state') }}","bridge_type":"{{ data.bridge_type if data else 'N/A' }}","bridge_hours":{{ data.bridge_hours if data else 0 }},"bridge_consumption_wh":{{ data.bridge_consumption_wh if data else 0 }},"energy_deficit_wh":{{ data.energy_deficit_wh if data else 0 }},"solar_remaining_wh":{{ data.expected_solar_wh if data else 0 }},"usable_solar_wh":{{ data.usable_solar_wh if data else 0 }},"sunrise_hour":{{ data.sunrise_hour if data else 0 }},"solar_start":{{ data.solar_start if data else 0 }},"max_grid_target":{{ data.max_grid_target if data else 100 }},"is_low_solar":{{ data.is_low_solar_day | lower if data else 'true' }},"price_ct":{{ (states('sensor.tibber_cached_energy_prices') | float(999) * 100) | round(2) }},"next_price_ct":{{ data.next_price_cents if data else 0 }},"price_drop_ct":{{ data.price_drop_cents if data else 0 }},"percentile":{{ states('sensor.tibber_energy_price_percentile_next_12_hours') | float(100) }},"wear_cost_ct":{{ states('input_number.battery_wear_cost_per_kwh') | float(2) }},"decision":"{{ data.decision_reason if data else 'N/A' }}","flags":{"charging":{{ is_state('input_boolean.battery_charging_active','on') | lower }},"no_discharge":{{ is_state('input_boolean.battery_no_discharging_active','on') | lower }},"automation":{{ is_state('input_boolean.battery_automation_on','on') | lower }},"manual":{{ is_state('input_boolean.manual_battery_charge','on') | lower }}},"sensors":{"start":{{ is_state('binary_sensor.should_start_charging','on') | lower }},"stop":{{ is_state('binary_sensor.should_stop_charging','on') | lower }},"hold":{{ is_state('binary_sensor.should_hold_battery_soc','on') | lower }},"profitable":{{ is_state('binary_sensor.battery_charging_is_profitable_enhanced','on') | lower }},"car":{{ is_state('binary_sensor.car_charging_stable','on') | lower }},"price_data_valid":{{ is_state('binary_sensor.tibber_cached_price_data_valid','on') | lower }}},"inverter":{"battery_w":{{ states('sensor.battery_power') | float(0) | round(0) }},"ac_w":{{ states('sensor.reading_energy_inverter_ac_output') | float(0) | round(0) }},"grid_w":{{ states('sensor.reading_energy_main_meter') | float(0) | round(0) }},"storctl":"{{ states('switch.storctl_mod') }}"},"car":{"wallbox_w":{{ states('sensor.wattpilot_charging_power') | float(0) | round(0) }},"house_w":{{ states('sensor.house_consumption') | float(0) | round(0) }},"discharge_limit_pct":{{ states('sensor.discharge_limit_percentage') | float(100) }},"surplus_extra_w":{{ states('sensor.battery_surplus_discharge_power') | float(0) }}},"prices":{"today":{{ cached_today | length }},"tomorrow":{{ cached_tomorrow | length }},"raw_today":{{ raw_today | length }},"raw_tomorrow":{{ raw_tomorrow | length }},"cache_status":"{{ state_attr('sensor.tibber_cached_energy_prices', 'cache_status') }}","hours_remaining":{{ state_attr('sensor.tibber_cached_energy_prices', 'hours_remaining') | float(0) }}}}
  mode: queued
  max: 5


# Reset battery target SoC on HA startup to prevent stale values after crashes
- alias: "Reset Battery Target on Startup"
  description: "Resets battery_target_soc to default on HA restart"
  trigger:
    - platform: homeassistant
      event: start
  action:
    - delay:
        seconds: 30
    - service: input_number.set_value
      target:
        entity_id: input_number.battery_target_soc
      data:
        value: "{{ states('input_number.soc_target_default') | float(default=15) }}"
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.battery_charging_active
          - input_boolean.battery_no_discharging_active
          - input_boolean.manual_battery_charge
    - service: switch.turn_off
      target:
        entity_id: switch.StorCtl_Mod
    - service: script.turn_on
      target:
        entity_id: script.set_regular_charge

- alias: Solcast update
  description: ""
  trigger:
    - platform: state
      entity_id: binary_sensor.solcast_update_due
      to: "on"
  condition:
    - condition: sun
      before: sunset
      after: sunrise
  action:
    - delay:
        seconds: "{{ range(30, 360)|random|int }}"
    - service: solcast_solar.update_forecasts
      data: {}
  mode: single

# =============================================================================
# SMARTPHONE NOTIFICATIONS
# Conventions: every alert has a `tag` (updates replace instead of stack) and
# `group: battery` (collapsed into one thread). Resolvable alerts send
# `clear_notification` with the same tag when the condition clears.
# =============================================================================
- alias: "Notify when Battery Charging is Active"
  trigger:
    - platform: state
      entity_id: input_boolean.battery_charging_active
      to: "on"
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "🔋 Battery Charging Started"
        message: >-
          {{ states('sensor.batterie_soc') }}% → {{ states('input_number.battery_target_soc') | float(15) | round(0) }}%
          at {{ (states('sensor.tibber_cached_energy_prices') | float(0) * 100) | round(1) }} ct/kWh
          (percentile {{ states('sensor.tibber_energy_price_percentile_next_12_hours') | float(0) | round(0) }}%).
          Reason: {{ state_attr('sensor.battery_optimization_data', 'calculation_data').decision_reason
                     if state_attr('sensor.battery_optimization_data', 'calculation_data') else 'n/a' }}
        data:
          tag: battery_charging
          group: battery
          actions:
            - action: "BATTERY_STOP_CHARGING"
              title: "Stop & pause automation"

- alias: "Notify when Battery Charging Finished"
  trigger:
    - platform: state
      entity_id: input_boolean.battery_charging_active
      from: "on"
      to: "off"
  action:
    # Same tag — replaces the "charging started" notification
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "🔋 Battery Charging Finished"
        message: >-
          Stopped at {{ states('sensor.batterie_soc') }}%.
          Current price {{ (states('sensor.tibber_cached_energy_prices') | float(0) * 100) | round(1) }} ct/kWh.
        data:
          tag: battery_charging
          group: battery

- alias: "Notify when No Battery Discharging is Active"
  trigger:
    # Debounce: short flaps (car-charging detection settling) don't notify
    - platform: state
      entity_id: input_boolean.battery_no_discharging_active
      to: "on"
      for:
        minutes: 2
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "🔒 Battery Discharge Limited"
        message: >-
          {{ states('sensor.battery_control_status') }} —
          SoC {{ states('sensor.batterie_soc') }}%,
          discharge limit {{ states('sensor.discharge_limit_percentage') | float(100) | round(0) }}%
          {%- if is_state('binary_sensor.car_charging_stable', 'on') %},
          wallbox {{ states('sensor.wattpilot_charging_power') | float(0) | round(0) }} W{% endif %}.
        data:
          tag: battery_discharge_limit
          group: battery

- alias: "Clear Discharge Limit Notification"
  trigger:
    - platform: state
      entity_id: input_boolean.battery_no_discharging_active
      from: "on"
      to: "off"
      for:
        minutes: 2
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        message: clear_notification
        data:
          tag: battery_discharge_limit

- alias: "Notify when Battery SoC is below 7.5%"
  trigger:
    - platform: numeric_state
      entity_id: sensor.reading_energy_battery_soc_scaled
      below: 750  # scaled SoC: 750 = 7.5%
      for:
        minutes: 5
  condition:
    # Don't alarm on Modbus glitches reading SoC as 0/unavailable
    - condition: state
      entity_id: binary_sensor.inverter_data_valid
      state: "on"
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "🪫 Battery Critically Low"
        message: >-
          Battery SoC is {{ states('sensor.batterie_soc') }}% — below the 7.5% reserve.
          Mode: {{ states('sensor.battery_control_mode') }},
          state: {{ states('sensor.charging_state') }}.
        data:
          tag: battery_soc_low
          group: battery
          # Android: deliver immediately
          ttl: 0
          priority: high
          # iOS: critical alert (breaks through silent mode)
          push:
            sound:
              name: default
              critical: 1
              volume: 0.8

- alias: "Handle Battery Notification Actions"
  description: "Action buttons on battery notifications"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: BATTERY_STOP_CHARGING
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: BATTERY_RESUME_AUTOMATION
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.action == 'BATTERY_STOP_CHARGING' }}"
          sequence:
            # Pause automation FIRST so the coordinator can't restart the charge
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.battery_automation_on
                  - input_boolean.manual_battery_charge
            - service: script.turn_on
              target:
                entity_id: script.stop_battery_charging
            - service: notify.mobile_app_f4gdn4ry0gpq_2
              data:
                title: "⏸️ Charging Stopped, Automation Paused"
                message: >-
                  Battery automation is OFF until you resume it.
                  SoC: {{ states('sensor.batterie_soc') }}%.
                data:
                  tag: battery_charging
                  group: battery
                  actions:
                    - action: "BATTERY_RESUME_AUTOMATION"
                      title: "Resume automation"
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.action == 'BATTERY_RESUME_AUTOMATION' }}"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.battery_automation_on
            - service: notify.mobile_app_f4gdn4ry0gpq_2
              data:
                title: "▶️ Battery Automation Resumed"
                message: "Normal price-optimized operation is active again."
                data:
                  tag: battery_charging
                  group: battery

- alias: "Notify when Inverter Data is Invalid"
  description: "Alerts on Modbus/Fronius outages (SoC register unavailable or 0)"
  trigger:
    - platform: state
      entity_id: binary_sensor.inverter_data_valid
      to: "off"
      for:
        minutes: 10
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "⚠️ Inverter Data Invalid"
        message: >-
          No valid Fronius/Modbus data for 10 minutes
          (SoC register: {{ states('sensor.reading_energy_battery_soc_scaled') }}).
          Battery automation decisions are paused until data returns.
        data:
          tag: inverter_outage
          group: battery
          ttl: 0
          priority: high

- alias: "Notify when Inverter Data is Restored"
  trigger:
    - platform: state
      entity_id: binary_sensor.inverter_data_valid
      from: "off"
      to: "on"
      for:
        minutes: 2
  action:
    # Replace the outage alert with a short all-clear
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "✅ Inverter Data Restored"
        message: "Fronius data is valid again. SoC: {{ states('sensor.batterie_soc') }}%."
        data:
          tag: inverter_outage
          group: battery

- alias: "Notify when Price Data is Invalid"
  description: "Alerts when Tibber price data is stale and the cache has expired"
  trigger:
    - platform: state
      entity_id: binary_sensor.tibber_cached_price_data_valid
      to: "off"
      for:
        hours: 1
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "⚠️ Price Data Invalid"
        message: >-
          Tibber price data has been invalid for 1 hour
          (cache: {{ state_attr('sensor.tibber_cached_energy_prices', 'cache_status') }},
          {{ state_attr('sensor.tibber_cached_energy_prices', 'hours_remaining') | float(0) | round(1) }} h remaining).
          Battery runs on the default target.
        data:
          tag: price_data_outage
          group: battery

- alias: "Notify when Price Data is Restored"
  trigger:
    - platform: state
      entity_id: binary_sensor.tibber_cached_price_data_valid
      from: "off"
      to: "on"
      for:
        minutes: 5
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        message: clear_notification
        data:
          tag: price_data_outage

- alias: "Rotate Battery Algorithm Log"
  description: "Archives battery_algorithm.log to a gzipped, month-labelled file (1st of month)"
  trigger:
    - platform: time
      at: "03:00:00"
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - service: shell_command.rotate_battery_log

- alias: "Notify when Tibber Pulse is not functioning"
  trigger:
    - platform: state
      entity_id: binary_sensor.tibber_pulse_not_functioning
      to: "on"
      for:
        minutes: 5  # Wait 5 minutes to avoid false alarms from brief disconnections
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "⚠️ Tibber Pulse Offline"
        message: "Tibber Pulse is not reporting. Check the sensor's power or connectivity."
        data:
          tag: tibber_pulse_outage
          group: battery

- alias: "Clear Tibber Pulse Notification"
  trigger:
    - platform: state
      entity_id: binary_sensor.tibber_pulse_not_functioning
      from: "on"
      to: "off"
      for:
        minutes: 5
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        message: clear_notification
        data:
          tag: tibber_pulse_outage

# =============================================================================
# DISCHARGE LIMIT WATCHDOG (Fix 1)
# Register writes don't auto-revert and the release path can leave StorCtl=0
# for minutes after a mode flap — re-assert the limit every minute while in
# car_charging_only so enforcement never lapses between 5-min coordinator runs.
# =============================================================================
- alias: "Discharge Limit Watchdog"
  description: "Re-assert the dynamic discharge limit every minute during car_charging_only"
  trigger:
    - platform: time_pattern
      minutes: "/1"
  condition:
    - condition: state
      entity_id: sensor.battery_control_mode
      state: "car_charging_only"
  action:
    # Log only when the inverter actually drifted off the commanded limit —
    # measures how often enforcement lapses without waiting for the 5-min alert
    - if:
        - condition: template
          value_template: >
            {{ (states('sensor.percent_max_discharge_rte') | float(default=0)) >
               (states('sensor.discharge_limit_percentage') | float(default=100)) + 5 }}
      then:
        - service: notify.battery_log
          data:
            message: >
              {"schema":2,"ts":"{{ now().isoformat() }}","type":"watchdog","event":"discharge_limit_drift","commanded_pct":{{ states('sensor.discharge_limit_percentage') | float(100) | round(1) }},"actual_pct":{{ states('sensor.percent_max_discharge_rte') | float(0) | round(1) }},"storctl":"{{ states('switch.storctl_mod') }}"}
    - service: script.turn_on
      target:
        entity_id: script.set_dynamic_discharge_limit

# =============================================================================
# CAR SMART CHARGING (see CAR_SMART_CHARGING.md)
# Two independent mechanisms, cheap-grid takes precedence over boost:
#  - Solar-backed boost: Wattpilot native Boost lends home-battery energy to
#    the car while the charger stays in Eco, only when the coming sun will
#    demonstrably refill the loan (sensor.car_boost_energy_budget).
#  - Cheap grid window: very cheap/negative Tibber prices temporarily switch
#    Eco -> Default; the existing car-protection (car_charging_only) then keeps
#    the house on battery while the car charges from grid.
# =============================================================================
- alias: "Car Smart Charging Coordinator"
  description: "Starts/stops solar-backed car boost and cheap grid charging windows"
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.car_cheap_grid_window
        - binary_sensor.car_boost_viable
        - select.wattpilot_charging_mode
    - platform: state
      entity_id: binary_sensor.wattpilot_33175380_stecker
      to: "off"
    - platform: state
      entity_id: switch.wattpilot_boost
      to: "off"
    - platform: state
      entity_id: input_boolean.car_smart_charging_on
      to: "off"
    - platform: state
      entity_id: input_boolean.battery_charging_active
      to: "on"
    - platform: time_pattern
      minutes: "/5"
  action:
    - choose:
        # 0. Master switch off — release everything we control
        - conditions:
            - condition: state
              entity_id: input_boolean.car_smart_charging_on
              state: "off"
            - condition: template
              value_template: >
                {{ is_state('input_boolean.car_boost_active', 'on')
                   or is_state('input_boolean.car_cheap_grid_active', 'on') }}
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.wattpilot_boost
            - service: number.set_value
              target:
                entity_id: number.wattpilot_max_charging_current
              data:
                value: 16
            - if:
                - condition: state
                  entity_id: input_boolean.car_cheap_grid_active
                  state: "on"
                - condition: state
                  entity_id: select.wattpilot_charging_mode
                  state: "Default"
              then:
                - service: select.select_option
                  target:
                    entity_id: select.wattpilot_charging_mode
                  data:
                    option: "Eco"
            - service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.car_boost_active
                  - input_boolean.car_cheap_grid_active

        # 1. User override detected: we set Default, someone changed the mode.
        #    Hands off — clear the flag without touching the charger.
        - conditions:
            - condition: state
              entity_id: input_boolean.car_cheap_grid_active
              state: "on"
            - condition: template
              value_template: "{{ not is_state('select.wattpilot_charging_mode', 'Default') }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.car_cheap_grid_active

        # 2. Cheap grid window ended (or car unplugged) — back to Eco
        - conditions:
            - condition: state
              entity_id: input_boolean.car_cheap_grid_active
              state: "on"
            - condition: template
              value_template: >
                {{ is_state('binary_sensor.car_cheap_grid_window', 'off')
                   or is_state('binary_sensor.wattpilot_33175380_stecker', 'off') }}
          sequence:
            - service: select.select_option
              target:
                entity_id: select.wattpilot_charging_mode
              data:
                option: "Eco"
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.car_cheap_grid_active
            - service: notify.battery_log
              data:
                message: >
                  {"schema":2,"ts":"{{ now().isoformat() }}","type":"car","event":"cheap_grid_stop","price_ct":{{ (states('sensor.tibber_cached_energy_prices') | float(999) * 100) | round(2) }},"percentile":{{ states('sensor.tibber_energy_price_percentile_next_12_hours') | float(100) }},"connection_wh":{{ states('sensor.wattpilot_connection_charged') | float(0) | round(0) }}}
            - service: notify.mobile_app_f4gdn4ry0gpq_2
              data:
                title: "🚗 Cheap Grid Charging Ended"
                message: >-
                  Wallbox back in Eco. Price now
                  {{ (states('sensor.tibber_cached_energy_prices') | float(0) * 100) | round(1) }} ct/kWh
                  (percentile {{ states('sensor.tibber_energy_price_percentile_next_12_hours') | float(0) | round(0) }}%).
                data:
                  tag: car_cheap_grid
                  group: battery

        # 3. Cheap grid window opened — Eco -> Default (grid charges the car,
        #    existing car-protection keeps the house on battery)
        - conditions:
            - condition: state
              entity_id: binary_sensor.car_cheap_grid_window
              state: "on"
            - condition: state
              entity_id: input_boolean.car_cheap_grid_active
              state: "off"
            - condition: state
              entity_id: select.wattpilot_charging_mode
              state: "Eco"
          sequence:
            # Boost would fight grid charging — stop it first if running
            - if:
                - condition: state
                  entity_id: input_boolean.car_boost_active
                  state: "on"
              then:
                - service: switch.turn_off
                  target:
                    entity_id: switch.wattpilot_boost
                - service: number.set_value
                  target:
                    entity_id: number.wattpilot_max_charging_current
                  data:
                    value: 16
                - service: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.car_boost_active
            - service: select.select_option
              target:
                entity_id: select.wattpilot_charging_mode
              data:
                option: "Default"
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.car_cheap_grid_active
            - service: notify.battery_log
              data:
                message: >
                  {"schema":2,"ts":"{{ now().isoformat() }}","type":"car","event":"cheap_grid_start","price_ct":{{ (states('sensor.tibber_cached_energy_prices') | float(999) * 100) | round(2) }},"percentile":{{ states('sensor.tibber_energy_price_percentile_next_12_hours') | float(100) }}}
            - service: notify.mobile_app_f4gdn4ry0gpq_2
              data:
                title: "🚗 Cheap Grid Charging Started"
                message: >-
                  Price {{ (states('sensor.tibber_cached_energy_prices') | float(0) * 100) | round(1) }} ct/kWh
                  (percentile {{ states('sensor.tibber_energy_price_percentile_next_12_hours') | float(0) | round(0) }}%)
                  — wallbox switched Eco → Default. House stays on battery.
                data:
                  tag: car_cheap_grid
                  group: battery

        # 4. Boost no longer viable (budget spent, floor reached, unplugged,
        #    Wattpilot stopped it natively, battery automation took over) — clean up
        - conditions:
            - condition: state
              entity_id: input_boolean.car_boost_active
              state: "on"
            - condition: template
              value_template: >
                {{ is_state('binary_sensor.car_boost_viable', 'off')
                   or is_state('switch.wattpilot_boost', 'off')
                   or is_state('binary_sensor.wattpilot_33175380_stecker', 'off') }}
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.wattpilot_boost
            - service: number.set_value
              target:
                entity_id: number.wattpilot_max_charging_current
              data:
                value: 16
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.car_boost_active
            - service: notify.battery_log
              data:
                message: >
                  {"schema":2,"ts":"{{ now().isoformat() }}","type":"car","event":"boost_stop","soc":{{ states('sensor.batterie_soc') | float(0) }},"budget_wh":{{ states('sensor.car_boost_energy_budget') | float(0) | round(0) }},"connection_wh":{{ states('sensor.wattpilot_connection_charged') | float(0) | round(0) }}}
            - service: notify.mobile_app_f4gdn4ry0gpq_2
              data:
                title: "☀️ Car Solar Boost Ended"
                message: >-
                  Battery SoC {{ states('sensor.batterie_soc') }}%,
                  remaining boost budget {{ states('sensor.car_boost_energy_budget') | float(0) | round(0) }} Wh.
                data:
                  tag: car_boost
                  group: battery

        # 5. Boost start: sun will refill the battery — lend energy to the car
        #    now via Wattpilot native Boost (charger stays in Eco)
        - conditions:
            - condition: state
              entity_id: binary_sensor.car_boost_viable
              state: "on"
            - condition: state
              entity_id: input_boolean.car_boost_active
              state: "off"
            - condition: state
              entity_id: input_boolean.car_cheap_grid_active
              state: "off"
            - condition: state
              entity_id: binary_sensor.car_cheap_grid_window
              state: "off"
            # Only kick in when Eco is NOT already charging the car (that's
            # the point: bridge the no-surplus wait)
            - condition: numeric_state
              entity_id: sensor.wattpilot_charging_power
              below: 100
          sequence:
            - service: select.select_option
              target:
                entity_id: select.wattpilot_boost_type
              data:
                option: "One-Time"
            # Hardware-enforced stop: Wattpilot itself stops discharging the
            # home battery at the computed floor SoC
            - service: number.set_value
              target:
                entity_id: number.wattpilot_boost_discharges_until
              data:
                value: "{{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') | float(default=30) | round(0) }}"
            # Cap car power so the draw roughly matches battery + PV capability
            - service: number.set_value
              target:
                entity_id: number.wattpilot_max_charging_current
              data:
                value: "{{ states('input_number.car_boost_charging_current_a') | float(default=6) | round(0) }}"
            - service: switch.turn_on
              target:
                entity_id: switch.wattpilot_boost
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.car_boost_active
            - service: notify.battery_log
              data:
                message: >
                  {"schema":2,"ts":"{{ now().isoformat() }}","type":"car","event":"boost_start","soc":{{ states('sensor.batterie_soc') | float(0) }},"floor":{{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') | float(30) }},"budget_wh":{{ states('sensor.car_boost_energy_budget') | float(0) | round(0) }},"data":{{ (state_attr('sensor.car_boost_energy_budget', 'calculation_data') or {}) | to_json }}}
            - service: notify.mobile_app_f4gdn4ry0gpq_2
              data:
                title: "☀️ Car Solar Boost Started"
                message: >-
                  Sun will refill the battery — lending
                  {{ states('sensor.car_boost_energy_budget') | float(0) | round(0) }} Wh
                  to the car at {{ states('input_number.car_boost_charging_current_a') | float(6) | round(0) }} A.
                  Battery {{ states('sensor.batterie_soc') }}% → floor
                  {{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') | float(30) | round(0) }}%.
                data:
                  tag: car_boost
                  group: battery
  mode: single
  max_exceeded: silent

- alias: "Car Boost No-Power Watchdog"
  description: "Stops a boost that moves no energy (car full/paused) and suppresses retries until replug"
  trigger:
    # Poll-based on purpose: a numeric_state trigger only fires on a threshold
    # crossing — if the car never draws power after boost start, it would
    # never fire. This checks every 5 minutes instead.
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: input_boolean.car_boost_active
      state: "on"
      for:
        minutes: 15
    - condition: numeric_state
      entity_id: sensor.wattpilot_charging_power
      below: 100
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.wattpilot_boost
    - service: number.set_value
      target:
        entity_id: number.wattpilot_max_charging_current
      data:
        value: 16
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.car_boost_active
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.car_boost_suppressed
    - service: notify.battery_log
      data:
        message: >
          {"schema":2,"ts":"{{ now().isoformat() }}","type":"car","event":"boost_suppressed","reason":"no_power_15min","carstate":"{{ states('sensor.wattpilot_carstate') }}"}
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "☀️ Car Solar Boost Suppressed"
        message: >-
          Boost was active but the car drew no power for 15 min
          (car state: {{ states('sensor.wattpilot_carstate') }}).
          Suppressed until the car is replugged.
        data:
          tag: car_boost
          group: battery

- alias: "Car Boost Suppression Reset"
  description: "Replugging the car clears the boost suppression"
  trigger:
    - platform: state
      entity_id: binary_sensor.wattpilot_33175380_stecker
      from: "off"
      to: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.car_boost_suppressed

- alias: "Car Boost Heartbeat Logger"
  description: "Per-5-min drain trace while a boost runs — the data that had to be reconstructed by hand after the 2026-07-07 incident"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: input_boolean.car_boost_active
      state: "on"
  action:
    - service: notify.battery_log
      data:
        message: >
          {"schema":2,"ts":"{{ now().isoformat() }}","type":"car","event":"boost_heartbeat","soc":{{ states('sensor.batterie_soc') | float(0) }},"soc_scaled":{{ states('sensor.reading_energy_battery_soc_scaled') | float(0) }},"floor":{{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') | float(30) }},"budget_wh":{{ states('sensor.car_boost_energy_budget') | float(0) | round(0) }},"wallbox_w":{{ states('sensor.wattpilot_charging_power') | float(0) | round(0) }},"battery_w":{{ states('sensor.battery_power') | float(0) | round(0) }},"solar_w":{{ states('sensor.total_solar_power') | float(0) | round(0) }},"carstate":"{{ states('sensor.wattpilot_carstate') }}"}
  mode: single
  max_exceeded: silent

- alias: "Reset Car Smart Charging on Startup"
  description: "Clears stale car boost / cheap grid state after a HA restart"
  trigger:
    - platform: homeassistant
      event: start
  action:
    - delay:
        seconds: 45
    # Restore whenever boost is (or was) in play — covers a crash in the gap
    # between boost-off and current-restore where the flag is already cleared
    # but the current was left lowered. Matching the boost current exactly
    # avoids stomping a deliberate manual setting.
    - if:
        - condition: or
          conditions:
            - condition: state
              entity_id: input_boolean.car_boost_active
              state: "on"
            - condition: state
              entity_id: switch.wattpilot_boost
              state: "on"
            - condition: template
              value_template: >
                {{ states('number.wattpilot_max_charging_current') | float(default=16)
                   == states('input_number.car_boost_charging_current_a') | float(default=6) }}
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.wattpilot_boost
        - service: number.set_value
          target:
            entity_id: number.wattpilot_max_charging_current
          data:
            value: 16
    - if:
        - condition: state
          entity_id: input_boolean.car_cheap_grid_active
          state: "on"
        - condition: state
          entity_id: select.wattpilot_charging_mode
          state: "Default"
      then:
        - service: select.select_option
          target:
            entity_id: select.wattpilot_charging_mode
          data:
            option: "Eco"
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.car_boost_active
          - input_boolean.car_cheap_grid_active

- alias: "Notify when Discharge Limit Enforcement Fails"
  description: "Alerts if the inverter's actual discharge rate drifts above the commanded limit for 5+ minutes"
  trigger:
    # Sustained deviation only — the `for` requires the mismatch to persist
    # for 5 minutes, so transient oscillation between watchdog re-writes
    # doesn't trigger false alarms.
    - platform: template
      value_template: >
        {{ (states('sensor.percent_max_discharge_rte') | float(default=0)) >
           (states('sensor.discharge_limit_percentage') | float(default=100)) + 5 }}
      for: "00:05:00"
  condition:
    - condition: state
      entity_id: sensor.battery_control_mode
      state: "car_charging_only"
  action:
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "⚠️ Discharge Limit Not Enforced"
        message: >-
          Actual discharge rate {{ states('sensor.percent_max_discharge_rte') | float(0) | round(0) }}%
          exceeds the commanded limit of
          {{ states('sensor.discharge_limit_percentage') | float(100) | round(0) }}%
          while in car_charging_only. Check switch.storctl_mod / register 40358.
        data:
          tag: battery_discharge_enforcement_failed
          group: battery

# =============================================================================
# OUTCOME LOGGING — results, not just decisions
# The main logger records what the algorithm decided; these two record what it
# achieved: cost per charge cycle vs the day-average counterfactual, and the
# daily Solcast forecast error (calibration data for the boost confidence).
# =============================================================================
- alias: "Log Charge Cycle Summary"
  description: "One JSON line per finished charge cycle: energy, cost, and saving vs day-average price"
  trigger:
    - platform: state
      entity_id: input_boolean.battery_charging_active
      from: "on"
      to: "off"
  action:
    # Let the cycle tracker (trigger-based template sensor on the same flag)
    # finalize the cycle before reading it
    - delay:
        seconds: 15
    - condition: template
      value_template: >
        {% set d = state_attr('sensor.battery_charge_cycle_tracker', 'data') or {} %}
        {{ (d.get('last_cycle') or {}) != {} }}
    - service: notify.battery_log
      data:
        message: >
          {% set d = state_attr('sensor.battery_charge_cycle_tracker', 'data') or {} %}
          {% set c = d.get('last_cycle', {}) %}
          {"schema":2,"ts":"{{ now().isoformat() }}","type":"outcome","event":"charge_cycle_summary","started":"{{ c.get('started', 'unknown') }}","kwh":{{ c.get('kwh', 0) }},"cost_eur":{{ c.get('cost_eur', 0) }},"counterfactual_eur":{{ c.get('counterfactual_eur', 0) }},"saved_eur":{{ c.get('saved_eur', 0) }},"avg_price_ct":{{ c.get('avg_price_ct', 0) }},"day_avg_ct":{{ c.get('day_avg_ct', 0) }},"soc_end":{{ states('sensor.batterie_soc') | float(0) }},"month_kwh":{{ d.get('month_kwh', 0) }},"month_saved_eur":{{ d.get('month_saved_eur', 0) }}}
  mode: single

- alias: "Log Solar Forecast vs Actual"
  description: "Daily at sunset: Solcast total-today forecast vs measured PV energy — calibration data for boost solar confidence"
  trigger:
    - platform: sun
      event: sunset
  action:
    - service: notify.battery_log
      data:
        message: >
          {% set forecast_kwh = states('sensor.solcast_pv_forecast_prognose_heute') | float(default=-1) %}
          {% set actual_kwh = states('sensor.solar_energy_daily') | float(default=-1) %}
          {% set ratio = (actual_kwh / forecast_kwh) if forecast_kwh > 0 and actual_kwh >= 0 else -1 %}
          {"schema":2,"ts":"{{ now().isoformat() }}","type":"outcome","event":"solar_forecast_vs_actual","forecast_kwh":{{ forecast_kwh | round(2) }},"actual_kwh":{{ actual_kwh | round(2) }},"actual_over_forecast":{{ ratio | round(3) }},"boost_confidence_pct":{{ states('input_number.car_boost_solar_confidence_pct') | float(70) }}}
  mode: single

# =============================================================================
# GRID OUTAGE GUARD (Inselbetrieb)
# The GEN24 powers the whole house in an island, but the Wattpilot has no
# island awareness: outside Eco it keeps charging from battery + PV until the
# battery is empty or the inverter overload-trips (~3.68 kW/phase sustained).
# On confirmed grid loss (binary_sensor.grid_available off, 1 min debounce):
#   1. raise a running boost's Wattpilot hardware stop to the island floor
#   2. force the wallbox back to Eco (also overrides a manually set Default)
#   3. end any force-charge / hold / discharge-limit cycle so the battery can
#      freely supply the house
# Solar-backed boost stays available above the island floor
# (input_number.car_boost_island_floor_soc) — that is the only path that can
# still charge the car in an island, since Eco surplus detection needs the
# (dead) Smart Meter. Recovery is declarative: once grid_available has been on
# again for 5 min, the window/boost sensors recompute and the coordinator
# re-enters whatever state is then appropriate.
# =============================================================================
- alias: "Grid Outage Guard"
  description: "Forces a safe car/battery state during Inselbetrieb and hands back to the normal automations when the grid returns"
  trigger:
    - platform: state
      entity_id: binary_sensor.grid_available
      to: "off"
      id: island
    - platform: state
      entity_id: binary_sensor.grid_available
      from: "off"
      to: "on"
      id: restored
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: island
          sequence:
            # 1. Running boost: lift the Wattpilot's hardware stop to the
            #    island floor (floor_soc attr is island-aware by now). If SoC
            #    is already below it, car_boost_viable flips off and the
            #    coordinator cleans the boost up.
            - if:
                - condition: state
                  entity_id: input_boolean.car_boost_active
                  state: "on"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.wattpilot_boost_discharges_until
                  data:
                    value: "{{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') | float(default=75) | round(0) }}"
            # 2. Wallbox out of Eco (cheap grid window or manual Default):
            #    back to Eco — in an island Default charging has no grid behind it
            - if:
                - condition: template
                  value_template: "{{ not is_state('select.wattpilot_charging_mode', 'Eco') }}"
              then:
                - service: select.select_option
                  target:
                    entity_id: select.wattpilot_charging_mode
                  data:
                    option: "Eco"
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.car_cheap_grid_active
            # 3. End any charge/hold/discharge-limit cycle immediately —
            #    OutWRte/InWRte back to 100%, StorCtl off, flags cleared
            #    (the coordinator's own release path waits minutes)
            - if:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: input_boolean.battery_charging_active
                      state: "on"
                    - condition: state
                      entity_id: input_boolean.battery_no_discharging_active
                      state: "on"
              then:
                - service: script.turn_on
                  target:
                    entity_id: script.stop_battery_charging
                - service: input_boolean.turn_off
                  target:
                    entity_id:
                      - input_boolean.battery_no_discharging_active
                      - input_boolean.manual_battery_charge
            - service: notify.battery_log
              data:
                message: >
                  {"schema":2,"ts":"{{ now().isoformat() }}","type":"grid","event":"island_detected","freq_hz":{{ states('sensor.grid_frequency') | float(0) }},"meter":"{{ states('sensor.reading_energy_main_meter') }}","soc":{{ states('sensor.batterie_soc') | float(0) }},"wallbox_mode":"{{ states('select.wattpilot_charging_mode') }}","boost_active":{{ is_state('input_boolean.car_boost_active','on') | lower }}}
            - service: notify.mobile_app_f4gdn4ry0gpq_2
              data:
                title: "🏝️ Inselbetrieb erkannt"
                message: >-
                  Netzausfall — Haus läuft auf Batterie/PV
                  (SoC {{ states('sensor.batterie_soc') }}%,
                  {{ states('sensor.grid_frequency') | float(0) | round(1) }} Hz).
                  Wallbox auf Eco gestellt, Netzladung gesperrt. Auto-Boost nur
                  noch oberhalb {{ states('input_number.car_boost_island_floor_soc') | float(75) | round(0) }}% SoC.
                data:
                  tag: grid_outage
                  group: battery
                  push:
                    interruption-level: time-sensitive

        - conditions:
            - condition: trigger
              id: restored
          sequence:
            # Running boost: put the hardware stop back to the normal floor
            - if:
                - condition: state
                  entity_id: input_boolean.car_boost_active
                  state: "on"
              then:
                - service: number.set_value
                  target:
                    entity_id: number.wattpilot_boost_discharges_until
                  data:
                    value: "{{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') | float(default=30) | round(0) }}"
            - service: notify.battery_log
              data:
                message: >
                  {"schema":2,"ts":"{{ now().isoformat() }}","type":"grid","event":"grid_restored","soc":{{ states('sensor.batterie_soc') | float(0) }}}
            - service: notify.mobile_app_f4gdn4ry0gpq_2
              data:
                title: "🔌 Netz wieder verfügbar"
                message: >-
                  Stromnetz seit 5 Minuten stabil — normale Automatik aktiv
                  (SoC {{ states('sensor.batterie_soc') }}%).
                data:
                  tag: grid_outage
                  group: battery
  mode: queued
  max: 4

# Companion to the Grid Outage Guard. The 2026-07-11 breaker test showed the
# Wattpilot reboots in the switchover gap and reconnects minutes AFTER the
# guard's one-shot Eco command (which then hit an unavailable entity — warning
# only). This watchdog re-enforces Eco whenever the wallbox is reachable in a
# non-Eco mode while the island is active: on reconnect, on a manual mode
# change, and every 5 minutes as a belt.
- alias: "Grid Outage Wallbox Watchdog"
  description: "Re-forces the Wattpilot to Eco if it (re)appears in a non-Eco mode during Inselbetrieb"
  trigger:
    - platform: state
      entity_id: select.wattpilot_charging_mode
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: binary_sensor.grid_available
      state: "off"
    - condition: template
      value_template: >
        {{ states('select.wattpilot_charging_mode')
           not in ['Eco', 'unavailable', 'unknown'] }}
  action:
    - service: select.select_option
      target:
        entity_id: select.wattpilot_charging_mode
      data:
        option: "Eco"
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.car_cheap_grid_active
    - service: notify.battery_log
      data:
        message: >
          {"schema":2,"ts":"{{ now().isoformat() }}","type":"grid","event":"island_wallbox_enforced","from_mode":"{{ trigger.from_state.state if (trigger.platform == 'state' and trigger.from_state) else 'periodic_check' }}","soc":{{ states('sensor.batterie_soc') | float(0) }}}
    - service: notify.mobile_app_f4gdn4ry0gpq_2
      data:
        title: "🏝️ Wallbox → Eco erzwungen"
        message: >-
          Wallbox war während des Inselbetriebs nicht in Eco
          (SoC {{ states('sensor.batterie_soc') }}%) — zurückgestellt.
        data:
          tag: grid_outage
          group: battery
  mode: single
  max_exceeded: silent

# The 2026-07-11 breaker test showed the Wattpilot integration gives up after
# a 15 s connect timeout during HA boot (custom component, no retry backoff)
# and its entities stay unavailable until a manual config-entry reload — 13 min
# in the test, indefinitely in a real outage. This retries the reload every
# 5 minutes while the entities are stale. Also covers ordinary WiFi dropouts
# of the charger. No mobile notification: recovery is silent, attempts are in
# the battery log.
- alias: "Wattpilot Reconnect Watchdog"
  description: "Reloads the Wattpilot config entry when its entities have been unavailable for 5+ minutes"
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: template
      value_template: >
        {% set s = states.select.wattpilot_charging_mode %}
        {{ s is not none
           and s.state in ['unavailable', 'unknown']
           and (now() - s.last_changed).total_seconds() > 300 }}
  action:
    - service: notify.battery_log
      data:
        message: >
          {"schema":2,"ts":"{{ now().isoformat() }}","type":"grid","event":"wattpilot_reload_attempt","stale_minutes":{{ ((now() - states.select.wattpilot_charging_mode.last_changed).total_seconds() / 60) | round(0) }}}
    - service: homeassistant.reload_config_entry
      target:
        entity_id: select.wattpilot_charging_mode
  mode: single
  max_exceeded: silent
