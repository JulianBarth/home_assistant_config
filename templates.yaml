      icon: mdi:alert-circle
      state: >
        {{ states('sensor.tibber_pulse_luftehutte_stromerzeugung') in ['unavailable', 'unknown', 'None'] }}

# ============================================================================
# Car Smart Charging (solar-backed boost + cheap grid windows)
# Concept: when today's remaining solar will demonstrably refill the home
# battery anyway, lend battery energy to the car NOW via the Wattpilot's
# native Boost (works as an overlay while the charger stays in Eco).
# Independently, very cheap grid prices open a "cheap grid window" that
# temporarily switches the charger from Eco to Default (full grid charge),
# which the existing car-protection then handles (house from battery,
# car from grid). See CAR_SMART_CHARGING.md.
# ============================================================================
- sensor:
    - name: "Car Boost Energy Budget"
      unique_id: car_boost_energy_budget_wh
      unit_of_measurement: "Wh"
      state_class: measurement
      icon: mdi:car-electric-outline
      state: >
        {% set model_stamp = as_timestamp(states('sensor.reutlingen_energy_model'), default=0) | float(0) %}
        {% set model_valid = 0 <= as_timestamp(now()) - model_stamp < 900 %}
        {% set d = state_attr('sensor.reutlingen_energy_model', 'car') or {} %}
        {% set soc = states('sensor.batterie_soc') | float(0) %}
        {% set raw_soc = states('sensor.reading_energy_battery_soc_scaled') | float(-1) %}
        {% set soc = [soc, raw_soc / 100] | min if 0 < raw_soc <= 10000 and 0 < soc <= 100 else 0 %}
        {% set capacity = states('input_number.battery_capacity_wh') | float(10000) %}
        {% set reserve = states('input_number.soc_target_default') | float(15) %}
        {% set floor = ([states('input_number.car_boost_min_soc') | float(30), reserve + 5] | max) + states('input_number.car_boost_floor_margin_pct') | float(10) %}
        {% set floor = ([floor, states('input_number.car_boost_island_floor_soc') | float(75)] | max) if is_state('binary_sensor.grid_available', 'off') else floor %}
        {% set budget = [[d.get('budget_wh', 0), (soc-floor) / 100 * capacity * (state_attr('sensor.reutlingen_energy_model', 'discharge_efficiency') | float(0.95))] | min, 0] | max if model_valid else 0 %}
        {{ budget | round(0) }}
      attributes:
        floor_soc: >
          {% set reserve = states('input_number.soc_target_default') | float(default=15) %}
          {% set load_margin = states('input_number.car_boost_floor_margin_pct') | float(default=10) %}
          {% set normal_floor = ([states('input_number.car_boost_min_soc') | float(default=30), reserve + 5] | max) + load_margin %}
          {% set island = is_state('binary_sensor.grid_available', 'off') %}
          {% set island_floor = states('input_number.car_boost_island_floor_soc') | float(default=75) %}
          {{ (([normal_floor, island_floor] | max) if island else normal_floor) | round(0) }}
        calculation_data: >
          {% set model_stamp = as_timestamp(states('sensor.reutlingen_energy_model'), default=0) | float(0) %}
          {% set model_valid = 0 <= as_timestamp(now()) - model_stamp < 900 %}
          {% set d = state_attr('sensor.reutlingen_energy_model', 'car') or {} %}
          {% set soc = states('sensor.batterie_soc') | float(0) %}
          {% set raw_soc = states('sensor.reading_energy_battery_soc_scaled') | float(-1) %}
          {% set soc = [soc, raw_soc / 100] | min if 0 < raw_soc <= 10000 and 0 < soc <= 100 else 0 %}
          {% set capacity = states('input_number.battery_capacity_wh') | float(10000) %}
          {% set reserve = states('input_number.soc_target_default') | float(15) %}
          {% set floor = ([states('input_number.car_boost_min_soc') | float(30), reserve + 5] | max) + states('input_number.car_boost_floor_margin_pct') | float(10) %}
          {% set floor = ([floor, states('input_number.car_boost_island_floor_soc') | float(75)] | max) if is_state('binary_sensor.grid_available', 'off') else floor %}
          {% set budget = [[d.get('budget_wh', 0), (soc-floor) / 100 * capacity * (state_attr('sensor.reutlingen_energy_model', 'discharge_efficiency') | float(0.95))] | min, 0] | max if model_valid else 0 %}
          {{ dict(d, model_valid=model_valid, budget_wh=budget | round(0)) }}

- binary_sensor:
    - name: "Car Boost Viable"
      unique_id: car_boost_viable
      icon: mdi:car-turbocharger
      state: >
        {% set grid_safe = is_state('binary_sensor.grid_control_ready', 'on') or (is_state('sensor.grid_connection_status', 'island') and is_state('binary_sensor.grid_available', 'off')) %}
        {% if not grid_safe %}
          {{ false }}
        {% else %}
        {% set master = is_state('input_boolean.car_smart_charging_on', 'on') %}
        {% set plugged = is_state('binary_sensor.wattpilot_33175380_stecker', 'on') %}
        {% set eco_mode = is_state('select.wattpilot_charging_mode', 'Eco') %}
        {% set suppressed = is_state('input_boolean.car_boost_suppressed', 'on') %}
        {% set data_valid = is_state('binary_sensor.inverter_data_valid', 'on') %}
        {% set battery_busy = is_state('input_boolean.battery_charging_active', 'on')
                              or is_state('input_boolean.battery_no_discharging_active', 'on')
                              or is_state('input_boolean.manual_battery_charge', 'on') %}
        {% set soc = states('sensor.batterie_soc') | float(default=0) %}
        {% set raw_soc = states('sensor.reading_energy_battery_soc_scaled') | float(-1) %}
        {% set soc = [soc, raw_soc / 100] | min if 0 < raw_soc <= 10000 and 0 < soc <= 100 else 0 %}
        {% set floor_soc = state_attr('sensor.car_boost_energy_budget', 'floor_soc') | float(default=30) %}
        {% set budget = states('sensor.car_boost_energy_budget') | float(default=0) %}
        {% set min_budget = states('input_number.car_boost_min_budget_wh') | float(default=2000) %}
        {% set boost_running = is_state('input_boolean.car_boost_active', 'on') %}

        {# Start near local daylight, with the model budget independently protecting
           both the bridge to solar and the following night. No fixed 15:00 cutoff. #}
        {% set calendar = state_attr('sensor.reutlingen_energy_model', 'calendar') or {} %}
        {% set today = calendar.get('today', {}) %}
        {% set rising = as_timestamp(today.get('sunrise'), default=0) | float(0) %}
        {% set setting = as_timestamp(today.get('sunset'), default=0) | float(0) %}
        {% set stamp = as_timestamp(now()) %}
        {% set in_start_window = rising > 0 and rising - 7200 <= stamp < setting - 3600 %}

        {# A car reporting "Complete" cannot take energy — starting anyway just #}
        {# flaps boost on/off until the no-power watchdog suppresses it (2026-07-04). #}
        {% set car_can_charge = states('sensor.wattpilot_carstate') != 'Complete' %}

        {% if boost_running %}
          {# Keep viable while running until the budget is truly gone — the #}
          {# min_budget threshold only gates STARTING a boost (hysteresis). #}
          {{ grid_safe and master and plugged and eco_mode and data_valid and not battery_busy
             and soc > floor_soc and budget > 0 }}
        {% else %}
          {{ grid_safe and master and plugged and eco_mode and not suppressed and data_valid
             and not battery_busy and soc >= (floor_soc + 3) and budget >= min_budget
             and in_start_window and car_can_charge }}
        {% endif %}
        {% endif %}

    - name: "Car Cheap Grid Window"
      unique_id: car_cheap_grid_window
      icon: mdi:cash-clock
      state: >
        {% set master = is_state('input_boolean.car_smart_charging_on', 'on') %}
        {% set plugged = is_state('binary_sensor.wattpilot_33175380_stecker', 'on') %}
        {% set price_valid = is_state('binary_sensor.tibber_cached_price_data_valid', 'on') %}
        {# Island guard: "grid charges the car" needs a grid — in Inselbetrieb the #}
        {# Default mode would drain the battery or overload-trip the inverter. #}
        {# Cached prices stay valid during an outage, so this must be explicit. #}
        {% set grid_ok = is_state('binary_sensor.grid_control_ready', 'on') %}
        {% set price_ct = states('sensor.tibber_cached_energy_prices') | float(default=999) * 100 %}
        {% set percentile = states('sensor.tibber_energy_price_percentile_next_12_hours') | float(default=100) %}
        {% set start_pct = states('input_number.car_cheap_grid_percentile') | float(default=10) %}
        {% set ceiling_ct = states('input_number.car_cheap_grid_max_price_ct') | float(default=15) %}
        {% set currently_on = is_state('binary_sensor.car_cheap_grid_window', 'on') %}

        {% if not (master and plugged and price_valid and grid_ok) %}
          {{ false }}
        {% elif price_ct < 0 %}
          {# Negative price: always charge the car from grid #}
          {{ true }}
        {% elif currently_on %}
          {# Hysteresis: stay on until clearly out of the cheap zone #}
          {{ percentile <= (start_pct + 15) and price_ct <= (ceiling_ct + 2) }}
        {% else %}
          {{ percentile <= start_pct and price_ct <= ceiling_ct }}
        {% endif %}

# ============================================================================
# AC grid-charge estimate. Integrate previous power and tariff, not a delayed
# total-battery-energy counter. The v2 baseline excludes legacy mixed-source
# totals and keeps them in legacy_totals for audit. This is a gross tariff
# comparison, not realized net savings after losses/wear/export opportunity.
# ============================================================================
- trigger:
    - platform: homeassistant
      event: start
      id: boot
    - platform: state
      entity_id: input_boolean.battery_charging_active
      to: "on"
      id: start
    - platform: state
      entity_id: input_boolean.battery_charging_active
      from: "on"
      to: "off"
      id: stop
    - platform: state
      entity_id:
        - sensor.grid_to_battery
        - sensor.tibber_cached_energy_prices
      id: sample
    - platform: time_pattern
      seconds: "/10"
      id: tick
  sensor:
    - name: "Battery Charge Cycle Tracker"
      unique_id: battery_charge_cycle_tracker
      unit_of_measurement: "EUR"
      icon: mdi:chart-line
      state: >
        {% set d = this.attributes.get('data', {}) if this is defined else {} %}
        {{ (d.get('month_saved_eur', 0) if d is mapping and d.get('accounting_version') == 2 else 0) | round(2) }}
      attributes:
        data: >
          {% set d = this.attributes.get('data', {}) if this is defined else {} %}
          {% if d is not mapping %}{% set d = {} %}{% endif %}
          {% set v2 = d.get('accounting_version') == 2 %}
          {% set legacy = d.get('legacy_totals', {}) if v2 else dict(month=d.get('month'), kwh=d.get('month_kwh', 0), cost_eur=d.get('month_cost_eur', 0), comparison_eur=d.get('month_counterfactual_eur', 0), price_advantage_eur=d.get('month_saved_eur', 0)) %}
          {% set stamp = as_timestamp(now()) %}
          {% set month = now().strftime('%Y-%m') %}
          {% set same_month = v2 and d.get('month') == month %}
          {% set m_kwh = d.get('month_kwh', 0) | float(0) if same_month else 0 %}
          {% set m_cost = d.get('month_cost_eur', 0) | float(0) if same_month else 0 %}
          {% set m_cf = d.get('month_counterfactual_eur', 0) | float(0) if same_month else 0 %}
          {% set m_cycles = d.get('month_cycles', 0) | int(0) if same_month else 0 %}
          {% set active = v2 and d.get('cycle_active', false) %}
          {% set c_kwh = d.get('cycle_kwh', 0) | float(0) if active else 0 %}
          {% set c_cost = d.get('cycle_cost_eur', 0) | float(0) if active else 0 %}
          {% set c_cf = d.get('cycle_counterfactual_eur', 0) | float(0) if active else 0 %}
          {% set started = d.get('cycle_start', 'unknown') if active else 'unknown' %}
          {% set last_cycle = d.get('last_cycle', {}) if v2 else {} %}
          {% set missed = d.get('unmeasured_seconds', 0) | float(0) if v2 else 0 %}
          {% set trig = trigger.id | default('none') %}
          {% set since = d.get('sample_ts', stamp) | float(stamp) if v2 else stamp %}
          {% set elapsed = [stamp - since, 0] | max %}
          {% set prices = (state_attr('sensor.tibber_cached_energy_prices', 'today') or []) + (state_attr('sensor.tibber_cached_energy_prices', 'tomorrow') or []) %}
          {% set tariff = namespace(price=none, until=0, total=0, count=0) %}
          {% for p in prices %}
            {% set ps = as_timestamp(p.startsAt, default=0) %}
            {% if ps <= stamp and stamp < ps + 900 %}
              {% set tariff.price = p.total | float %}
              {% set tariff.until = ps + 900 %}
            {% endif %}
            {% if (as_datetime(p.startsAt) | as_local).date() == now().date() %}
              {% set tariff.total = tariff.total + p.total | float %}
              {% set tariff.count = tariff.count + 1 %}
            {% endif %}
          {% endfor %}
          {% set day_avg = tariff.total / tariff.count if tariff.count > 0 else none %}
          {% set increment = namespace(kwh=0, cost=0, cf=0, month_kwh=0, month_cost=0, month_cf=0, covered=0) %}
          {% if active and trig != 'boot' and 0 < elapsed <= 120 and d.get('sample_valid', false) %}
            {# Split at the tariff boundary. The previous slot/average survives
               midnight even after cache attributes rotate to the new day. #}
            {% set boundary = d.get('sample_until', since) | float(since) %}
            {% set first = [[boundary, stamp] | min - since, 0] | max %}
            {% set tail = elapsed - first %}
            {% set watts = d.get('sample_w', 0) | float(0) %}
            {% set kwh = watts * first / 3600000 %}
            {% set cost = kwh * d.get('sample_price', 0) | float(0) %}
            {% set cf = kwh * d.get('sample_day_avg', 0) | float(0) %}
            {% set increment.kwh = kwh %}{% set increment.cost = cost %}{% set increment.cf = cf %}
            {% set increment.covered = first %}
            {% if same_month %}
              {% set increment.month_kwh = kwh %}{% set increment.month_cost = cost %}{% set increment.month_cf = cf %}
            {% endif %}
            {% if tail > 0 and tariff.price is not none and day_avg is not none %}
              {% set kwh = watts * tail / 3600000 %}
              {% set increment.kwh = increment.kwh + kwh %}
              {% set increment.cost = increment.cost + kwh * tariff.price %}
              {% set increment.cf = increment.cf + kwh * day_avg %}
              {% set increment.covered = elapsed %}
              {% set increment.month_kwh = increment.month_kwh + kwh %}
              {% set increment.month_cost = increment.month_cost + kwh * tariff.price %}
              {% set increment.month_cf = increment.month_cf + kwh * day_avg %}
            {% endif %}
          {% endif %}
          {% if active %}
            {% set c_kwh = c_kwh + increment.kwh %}
            {% set c_cost = c_cost + increment.cost %}
            {% set c_cf = c_cf + increment.cf %}
            {% set missed = missed + elapsed - increment.covered %}
          {% endif %}
          {% set m_kwh = m_kwh + increment.month_kwh %}
          {% set m_cost = m_cost + increment.month_cost %}
          {% set m_cf = m_cf + increment.month_cf %}
          {% if trig == 'stop' and active %}
            {% set last_cycle = dict(started=started, ended=now().isoformat(), kwh=c_kwh | round(4), cost_eur=c_cost | round(4), counterfactual_eur=c_cf | round(4), saved_eur=(c_cf - c_cost) | round(4), avg_price_ct=((c_cost / c_kwh * 100) if c_kwh > 0 else 0) | round(2), day_avg_ct=((c_cf / c_kwh * 100) if c_kwh > 0 else 0) | round(2), accounting_version=2) %}
            {% set m_cycles = m_cycles + 1 %}
            {% set active = false %}
          {% elif trig == 'boot' %}
            {# Never extrapolate a stored power reading across downtime. #}
            {% set active = false %}
          {% elif trig == 'start' and not active %}
            {% set active = true %}
            {% set started = now().isoformat() %}
            {% set c_kwh = 0 %}{% set c_cost = 0 %}{% set c_cf = 0 %}
          {% endif %}
          {% set valid = is_number(states('sensor.grid_to_battery')) and tariff.price is not none and day_avg is not none %}
          {{ dict(accounting_version=2, measured_since=d.get('measured_since', now().isoformat()) if v2 else now().isoformat(), legacy_totals=legacy, month=month,
               month_kwh=m_kwh | round(8), month_cost_eur=m_cost | round(8), month_counterfactual_eur=m_cf | round(8), month_saved_eur=(m_cf - m_cost) | round(8), month_cycles=m_cycles,
               cycle_active=active, cycle_start=started, cycle_kwh=c_kwh | round(8), cycle_cost_eur=c_cost | round(8), cycle_counterfactual_eur=c_cf | round(8), last_cycle=last_cycle,
               sample_ts=stamp, sample_w=states('sensor.grid_to_battery') | float(0), sample_valid=valid, sample_price=tariff.price, sample_until=tariff.until, sample_day_avg=day_avg, unmeasured_seconds=missed | round(1)) }}
