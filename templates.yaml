# Battery Status Sensors
- sensor:
    - name: "Batterie SoC"
      unique_id: 884c1888-1880-4e98-923c-795ff9264af2
      icon: mdi:home-battery-outline
      unit_of_measurement: "%"
      device_class: battery
      availability: "{{ is_number(states('sensor.reading_energy_battery_soc_scaled')) }}"
      state: >
        {{ (states('sensor.reading_energy_battery_soc_scaled') | float(0) / 100) | round(0) }}

    - name: "Charging State"
      unique_id: adf7fd02-94ac-4565-8392-c3b9d3b0d2dc
      state: >
        {% set mapper =  {
              '1' : 'OFF',
              '2' : 'EMPTY',
              '3' : 'DISCHARGING',
              '4' : 'CHARGING',
              '5' : 'FULL',
              '6' : 'HOLDING',
              '7' : 'TESTING'} %}
        {% set state =  states('sensor.ChaSt') %}
        {{ mapper[state] if state in mapper else 'Unknown' }}

# Binary sensors for solar forecast conditions
- binary_sensor:
    - name: "Expected Sun Low"
      unique_id: expected_sun_low
      device_class: power
      state: >
        {{ (states('sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute') | float(default=50) * 1000) <= states('input_number.sun_threshold_low') | float(default=15000) }}

    - name: "Expected Sun Very Low"
      unique_id: expected_sun_very_low
      device_class: power
      state: >
        {# Forecast Next X Hours is already in Wh — no kWh conversion #}
        {{ (states('sensor.solcast_pv_forecast_forecast_next_x_hours') | float(default=50000)) <= states('input_number.sun_threshold_very_low') | float(default=8000) }}

# Inverter/Modbus data validity — SoC register reading 0 or unavailable means the
# Fronius connection is down (e.g. the ~21h outage on 2026-04-27). Decision sensors
# gate on this instead of acting on a phantom SoC of 0.
- binary_sensor:
    - name: "Inverter Data Valid"
      unique_id: inverter_data_valid
      device_class: connectivity
      icon: mdi:database-check
      state: >
        {% set soc = states('sensor.reading_energy_battery_soc_scaled') | float(default=-1) %}
        {{ 0 < soc <= 10000 }}

# ============================================================================
# Grid classification: missing data is uncertainty, never proof of an outage.
# The locally verified ~53 Hz backup frequency is positive island evidence.
# Control permission is separate from the delayed outage notification signal.
# ============================================================================
- sensor:
    - name: "Grid Frequency"
      unique_id: grid_frequency_hz
      unit_of_measurement: "Hz"
      device_class: frequency
      state_class: measurement
      icon: mdi:sine-wave
      state: >
        {% set inverter = states('sensor.fronius_grid_frequency') | float(default=-1) %}
        {% set meter = states('sensor.fronius_meter_frequency') | float(default=-1) %}
        {# Keep plausible inverter readings authoritative, including island and
           abnormal frequencies. Only fall back when that source is invalid
           (notably zero during inverter sleep); never manufacture 50 Hz. #}
        {{ (inverter if 40 <= inverter <= 70 else meter) | round(2) }}
      availability: >
        {% set inverter = states('sensor.fronius_grid_frequency') | float(default=-1) %}
        {% set meter = states('sensor.fronius_meter_frequency') | float(default=-1) %}
        {{ 40 <= inverter <= 70 or 40 <= meter <= 70 }}
      attributes:
        source: >
          {% set inverter = states('sensor.fronius_grid_frequency') | float(default=-1) %}
          {% set meter = states('sensor.fronius_meter_frequency') | float(default=-1) %}
          {{ 'inverter' if 40 <= inverter <= 70 else 'meter' if 40 <= meter <= 70 else 'none' }}

- sensor:
    - name: "Grid Connection Status"
      unique_id: grid_connection_status
      icon: mdi:transmission-tower
      state: >
        {% set freq = states('sensor.grid_frequency') | float(default=-1) %}
        {% set meter = states('sensor.reading_energy_main_meter') %}
        {% if 51.5 <= freq <= 60 %}
          island
        {# Battery SoC availability is not grid evidence. Battery scripts keep
           their own validity gates; a healthy meter must still allow manual
           wallbox charging when only battery telemetry is lost. #}
        {% elif 49 <= freq <= 51 and is_number(meter) %}
          grid
        {% else %}
          uncertain
        {% endif %}

- binary_sensor:
    - name: "Grid Available"
      unique_id: grid_available
      device_class: power
      icon: mdi:transmission-tower
      # Off means confirmed island only; unavailable means insufficient evidence.
      availability: >
        {{ states('sensor.grid_connection_status') in ['grid', 'island'] }}
      delay_off:
        minutes: 1
      delay_on:
        minutes: 5
      state: "{{ is_state('sensor.grid_connection_status', 'grid') }}"

    - name: "Grid Control Ready"
      unique_id: grid_control_ready
      # Independent delay avoids reusing an old Grid Available state after a
      # brief unavailable period. Any missing signal revokes permission at once.
      delay_on:
        minutes: 5
      state: "{{ is_state('sensor.grid_connection_status', 'grid') }}"

# Binary sensor for charging conditions
- binary_sensor:
    - name: "Should Start Charging"
      unique_id: should_start_charging
      state: >
        {# Guard: reject invalid SoC readings (Modbus glitch protection) #}
        {% set soc_state = states('sensor.reading_energy_battery_soc_scaled') %}
        {% if soc_state in ['unavailable', 'unknown'] or soc_state | float(default=0) <= 0 %}
          {{ false }}
        {% else %}
        {% set current_soc = soc_state | float(default=0) %}
        {% set target_soc = states('sensor.computed_target_soc') | float(default=15) * 100 %}
        {% set default_min = states('input_number.soc_target_default') | float(default=15) * 100 %}
        {% set automation_on = is_state('input_boolean.battery_automation_on', 'on') %}
        {% set price_data_valid = is_state('binary_sensor.tibber_cached_price_data_valid', 'on') %}
        {% set charging_inactive = is_state('input_boolean.battery_charging_active', 'off') %}
        {# Scaled SoC units are % * 100 #}
        {% set hysteresis_buffer = states('input_number.soc_hist') | float(default=5) * 100 %}

        {# Only charge when algorithm actively wants to — computed_target must exceed #}
        {# the Fronius minimum. When computed_target = default, no charging is needed #}
        {# because Fronius handles min SoC natively. "Cheap" is relative to the day. #}
        {% set charging_justified = target_soc > default_min %}

        {# Reserve recovery: the Fronius native reserve sits at ~5 %, far below #}
        {# soc_target_default. After the 2026-07-07 boost overshoot the battery sat #}
        {# at 6-7 % for six hours because every price decision said "not profitable". #}
        {# Below default − 5 % the reserve is genuinely breached — recharge to the #}
        {# default regardless of profitability (should_stop_charging ends the cycle #}
        {# once computed_target is reached). Deliberately does not require valid #}
        {# price data: this is a protection action, not an optimization. #}
        {% set emergency_reserve = current_soc < (default_min - 500) %}

        {# Check if car is charging - don't interfere with car protection #}
        {% set car_is_charging = is_state('sensor.wattpilot_carconnected', 'charging') %}
        {% set wallbox_not_eco = not is_state('select.wattpilot_charging_mode', 'Eco') %}
        {% set car_protection_active = is_state('input_boolean.battery_no_discharging_active', 'on') %}

        {# Allow starting if: normal conditions met AND (car not charging OR car protection already handled) #}
        {% set basic_conditions = price_data_valid and (current_soc < (target_soc - hysteresis_buffer)) and automation_on and charging_inactive and charging_justified %}
        {% set car_safe = not (car_is_charging and wallbox_not_eco and not car_protection_active) %}

        {# Island guard: no grid to charge from — a force-charge command would also #}
        {# block discharge and starve the house (applies to the emergency path too) #}
        {% set grid_ok = is_state('binary_sensor.grid_control_ready', 'on') %}

        {{ (basic_conditions or (emergency_reserve and automation_on and charging_inactive)) and car_safe and grid_ok }}
        {% endif %}

    - name: "Should Stop Charging"
      unique_id: should_stop_charging
      state: >
        {% set current_soc = states('sensor.reading_energy_battery_soc_scaled') | float(default=0) %}
        {% set manual = is_state('input_boolean.manual_battery_charge', 'on') %}
        {% set charging_active = is_state('input_boolean.battery_charging_active', 'on') %}
        {% set inverter_invalid = not is_state('binary_sensor.inverter_data_valid', 'on')
           or not (0 < current_soc <= 10000) %}
        {% set grid_down = not is_state('binary_sensor.grid_control_ready', 'on') %}

        {% if manual %}
          {# Manual HOME BATTERY charge ignores prices, but ends at the user's
             target (including requests already satisfied). Never add start
             hysteresis to a stop target: 100% + hysteresis is unreachable. #}
          {% set target = states('input_number.manual_charge_target_soc') | float(default=-1) * 100 %}
          {{ not (0 < target <= 10000) or current_soc >= target or inverter_invalid or grid_down }}
        {% else %}
          {% set target = states('input_number.battery_target_soc') | float(default=100) * 100 %}
          {% set computed = states('sensor.computed_target_soc') | float(default=15) * 100 %}
          {% set price_valid = is_state('binary_sensor.tibber_cached_price_data_valid', 'on') %}
          {{ charging_active and (current_soc >= target
             or (price_valid and current_soc >= computed) or inverter_invalid or grid_down) }}
        {% endif %}

    - name: "Should Hold Battery SOC"
      unique_id: should_hold_battery_soc
      icon: mdi:battery-pause
      state: >
        {% set current_soc = states('sensor.reading_energy_battery_soc_scaled') | float(default=0) %}
        {% set target_entity = 'input_number.manual_charge_target_soc' if is_state('input_boolean.manual_battery_charge', 'on') else 'sensor.computed_target_soc' %}
        {% set target_soc = states(target_entity) | float(default=100) * 100 %}
        {% set charging_active = is_state('input_boolean.battery_charging_active', 'on') %}
        
        {# Hold threshold: configurable range around target (default ±3%) #}
        {% set hold_threshold = states('input_number.battery_hold_threshold') | float(default=3) * 100 %}
        
        {# Hold SOC when actively charging AND approaching target (within hold_threshold) #}
        {% set approaching_target = charging_active and (current_soc >= (target_soc - hold_threshold)) %}
        
        {# FIX: Disable hold mode if target is 100% (allows full charging) #}
        {% set target_not_full = target_soc < 9800 %}

        {# Island guard: holding SoC limits discharge — deadly for the island #}
        {% set grid_ok = is_state('binary_sensor.grid_control_ready', 'on') %}

        {{ approaching_target and target_not_full and grid_ok }}

    - name: "Should Prevent Discharge"
      unique_id: should_prevent_discharge
      icon: mdi:battery-lock-open
      state: >
        {# Prevent discharge if we are at or below the target SoC and not actively charging #}
        {% set current_soc = states('sensor.reading_energy_battery_soc_scaled') | float(default=0) %}
        {% set target_soc = states('sensor.computed_target_soc') | float(default=15) * 100 %}
        {% set automation_on = is_state('input_boolean.battery_automation_on', 'on') %}
        {% set charging_inactive = is_state('input_boolean.battery_charging_active', 'off') %}
        {% set current_state = is_state('binary_sensor.should_prevent_discharge', 'on') %}
        {# Scaled SoC units are % * 100 #}
        {% set hysteresis = states('input_number.soc_hist') | float(default=5) * 100 %}
        {% set data_valid = is_state('binary_sensor.inverter_data_valid', 'on') %}
        {# Island guard: preventing discharge cuts the house off its only supply #}
        {% set grid_down = not is_state('binary_sensor.grid_control_ready', 'on') %}

        {% if not automation_on or not charging_inactive or not data_valid or grid_down %}
          {{ false }}
        {% elif current_state %}
          {# Stay ON until we exceed the target + hysteresis #}
          {{ current_soc < (target_soc + hysteresis) }}
        {% else %}
          {# Turn ON if we drop to or below the target #}
          {{ current_soc <= target_soc }}
        {% endif %}

# Stable car charging detection with hysteresis
- binary_sensor:
    - name: "Car Charging Stable"
      unique_id: car_charging_stable
      device_class: battery_charging
      icon: mdi:ev-station
      state: >
        {% set is_charging = is_state('sensor.wattpilot_carconnected', 'charging') %}
        {% set wallbox_not_eco = not is_state('select.wattpilot_charging_mode', 'Eco') %}

        {% if not (is_charging and wallbox_not_eco) %}
          {{ false }}
        {% else %}
          {# Require the charging state to be stable for the configured hysteresis time #}
          {% set last_changed = as_timestamp(states.sensor.wattpilot_carconnected.last_changed) %}
          {% set now_ts = as_timestamp(now()) %}
          {% set stable_seconds = states('input_number.car_charging_hysteresis_minutes') | float(default=1) * 60 %}
          {{ (now_ts - last_changed) >= stable_seconds }}
        {% endif %}

    - name: "Solcast Update Due"
      unique_id: solcast_update_due
      state: >
        {% set nr = as_datetime(state_attr('sun.sun','next_rising')) | as_local %}
        {% set ns = as_datetime(state_attr('sun.sun','next_setting')) | as_local %}
        {% set api_request_limit = 10 %}
        {% if nr > ns %}
          {% set nr = nr - timedelta(hours = 24) %}
        {% endif %}
        {% set hours_difference = (ns - nr) %}
        {% set interval_hours = hours_difference / api_request_limit %}
        {% set ns = namespace(match = false) %}
        {% for i in range(api_request_limit) %}
          {% set start_time = nr + (i * interval_hours) %}
          {% if ((start_time - timedelta(seconds=30)) <= now()) and (now() <= (start_time + timedelta(seconds=30))) %}
            {% set ns.match = true %}
          {% endif %}
        {% endfor %}
        {{ ns.match }}

# Unified status sensor for monitoring
- sensor:
    - name: "Battery Control Status"
      unique_id: battery_control_status
      icon: mdi:state-machine
      state: >
        {% set charging = is_state('input_boolean.battery_charging_active', 'on') %}
        {% set discharge_limited = is_state('input_boolean.battery_no_discharging_active', 'on') %}
        {% set car_charging = is_state('binary_sensor.car_charging_stable', 'on') %}

        {% if charging and discharge_limited %}
          Charging (Car Protection Active)
        {% elif charging %}
          Charging (Normal)
        {% elif discharge_limited %}
          Discharge Limited (Car Charging)
        {% elif car_charging %}
          Car Charging (Waiting for Stable State)
        {% else %}
          Normal
        {% endif %}

# Computed target SoC sensor - Smart algorithm based on consumption patterns and solar forecast
    - name: "Battery Optimization Data"
      unique_id: battery_optimization_data
      icon: mdi:chart-timeline-variant
      state: >
        {% set model_stamp = as_timestamp(states('sensor.reutlingen_energy_model'), default=0) | float(0) %}
        {% set model_valid = 0 <= as_timestamp(now()) - model_stamp < 900 %}
        {% set data = state_attr('sensor.reutlingen_energy_model', 'battery') or dict(bridge_type='model_unavailable', bridge_hours=0, bridge_consumption_wh=0, energy_deficit_wh=0, expected_solar_wh=0, usable_solar_wh=0, sunrise_hour=0, solar_start=24, max_grid_target=15, is_low_solar_day=true) %}
        {% set default_target = states('input_number.soc_target_default') | float(15) %}
        {% set battery_capacity = states('input_number.battery_capacity_wh') | float(10000) %}
        {% set battery_capacity = battery_capacity if 1000 <= battery_capacity <= 50000 else 10000 %}
        {% set energy_deficit_wh = data.get('energy_deficit_wh', 0) %}
        {% set deficit_soc = energy_deficit_wh / battery_capacity * 100 %}
        {% set max_grid_target = data.get('max_grid_target', default_target) %}
        {% set calculated_target = data.get('calculated_target', default_target) %}
        {% set percentile = states('sensor.tibber_energy_price_percentile_next_12_hours') | float(100) %}
        {% set is_profitable = is_state('binary_sensor.battery_charging_is_profitable_enhanced', 'on') %}
        {% set price_data_valid = is_state('binary_sensor.tibber_cached_price_data_valid', 'on') %}
        {% set current_price_cents = states('sensor.tibber_cached_energy_prices') | float(999) * 100 %}
        {% set is_negative_price = current_price_cents < 0 %}
        {# === FINAL TARGET CALCULATION === #}
        {# Priority 1: Negative prices - always charge to 100% #}
        {% if not model_valid or not price_data_valid %}
          {{ default_target }}
        {% elif is_negative_price %}
          100
        
        {# Priority 2: Not profitable to charge - maintain minimum #}
        {# "Not Profitable" means: (Future Peak * 0.90) <= (Current Price + Wear) #}
        {# It is cheaper to buy from grid later than to store now #}
        {% elif not is_profitable %}
          {{ default_target }}

        {# Priority 3: Profitable + Very cheap (Bottom 10%) - Aggressive charging #}
        {# Fill up + 20% buffer because it's a great price, but respect solar headroom #}
        {% elif percentile <= 10 %}
          {{ [[[calculated_target + 20, max_grid_target] | min, 100] | min, default_target] | max | round(0) }}

        {# Priority 4: Profitable + Cheap (Bottom 25%) - Full Target #}
        {# Fill up to cover the deficit #}
        {% elif percentile <= 25 %}
          {{ [[calculated_target, 100] | min, default_target] | max | round(0) }}

        {# Priority 5: Profitable + Moderate (Bottom 50%) - Hedge #}
        {# Charge a bit (80% of deficit) just in case #}
        {% elif percentile <= 50 %}
          {% set hedged_target = default_target + (deficit_soc * 0.8) %}
          {{ [[[hedged_target, max_grid_target] | min, 100] | min, default_target] | max | round(0) }}
        
        {# Priority 6: Profitable but expensive time (Top 50%) #}
        {# Even if profitable, we should wait for better prices if possible #}
        {# Only charge if strict deficit requires it, but conservatively #}
        {% elif percentile <= 70 and energy_deficit_wh > (battery_capacity * 0.5) %}
          {% set conservative_target = default_target + (deficit_soc * 0.5) %}
          {{ [[[conservative_target, max_grid_target] | min, 70] | min, default_target] | max | round(0) }}
        
        {# Default: Maintain minimum #}
        {% else %}
          {{ default_target }}
        {% endif %}
      attributes:
        calculation_data: >
          {% set model_stamp = as_timestamp(states('sensor.reutlingen_energy_model'), default=0) | float(0) %}
          {% set model_valid = 0 <= as_timestamp(now()) - model_stamp < 900 %}
          {% set data = state_attr('sensor.reutlingen_energy_model', 'battery') or dict(bridge_type='model_unavailable', bridge_hours=0, bridge_consumption_wh=0, energy_deficit_wh=0, expected_solar_wh=0, usable_solar_wh=0, sunrise_hour=0, solar_start=24, max_grid_target=15, is_low_solar_day=true) %}
          {% set default_target = states('input_number.soc_target_default') | float(15) %}
          {% set battery_capacity = states('input_number.battery_capacity_wh') | float(10000) %}
          {% set battery_capacity = battery_capacity if 1000 <= battery_capacity <= 50000 else 10000 %}
          {% set energy_deficit_wh = data.get('energy_deficit_wh', 0) %}
          {% set deficit_soc = energy_deficit_wh / battery_capacity * 100 %}
          {% set max_grid_target = data.get('max_grid_target', default_target) %}
          {% set calculated_target = data.get('calculated_target', default_target) %}
          {% set percentile = states('sensor.tibber_energy_price_percentile_next_12_hours') | float(100) %}
          {% set is_profitable = is_state('binary_sensor.battery_charging_is_profitable_enhanced', 'on') %}
          {% set price_data_valid = is_state('binary_sensor.tibber_cached_price_data_valid', 'on') %}
          {% set current_price_cents = states('sensor.tibber_cached_energy_prices') | float(999) * 100 %}
          {% set is_negative_price = current_price_cents < 0 %}
          {% set next_price_cents = states('sensor.tibber_energy_price_next_hour') | float(999) %}
          {% if not model_valid or not price_data_valid %}
            {% set reason = "Model or price data unavailable: maintain minimum target" %}
          {% elif is_negative_price %}
            {% set reason = "Negative price: charge to 100%" %}
          {% elif not is_profitable %}
             {% set reason = "Not profitable: Buy later < Store now" %}
          {% elif percentile <= 10 %}
            {% set reason = "Bottom 10%: aggressive (+20%)" %}
          {% elif percentile <= 25 %}
            {% set reason = "Bottom 25%: full target" %}
          {% elif percentile <= 50 %}
            {% set reason = "Bottom 50%: 80% of target" %}
          {% elif percentile <= 70 and energy_deficit_wh > (battery_capacity * 0.5) %}
            {% set reason = "Bottom 70% + High Deficit: conservative" %}
          {% else %}
            {% set reason = "Profitable but high percentile: minimum target" %}
          {% endif %}

          {{ dict(data, model_valid=model_valid, decision_reason=reason,
                  current_price_cents=current_price_cents, next_price_cents=next_price_cents,
                  price_drop_cents=next_price_cents-current_price_cents, price_percentile=percentile) }}

    - name: "Computed Target SoC"
      unique_id: computed_target_soc
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:battery-charging-wireless
      state: >
        {{ states('sensor.battery_optimization_data') | float(default=15) }}
      attributes:
        debug_info: >
          {{ state_attr('sensor.battery_optimization_data', 'calculation_data') }}

# Balcony Power Plant (Balkonkraftwerk) Sensors
- sensor:
    - name: "Balkonkraftwerk Power"
      unique_id: balkonkraftwerk_power
      icon: mdi:solar-power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{ states('sensor.inverter_power') | float(default=0) }}

    - name: "Balkonkraftwerk Daily Energy"
      unique_id: balkonkraftwerk_daily_energy
      icon: mdi:solar-panel
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: >
        {{ states('sensor.inverter_daily_energy') | float(default=0) }}

    - name: "Balkonkraftwerk Status"
      unique_id: balkonkraftwerk_status
      icon: mdi:state-machine
      state: >
        {% set power = states('sensor.inverter_power') | float(default=0) %}
        {% if power > 10 %}
          Producing
        {% elif power > 0 %}
          Idle
        {% else %}
          Offline
        {% endif %}

- binary_sensor:
    - name: "Balkonkraftwerk Online"
      unique_id: balkonkraftwerk_online
      device_class: connectivity
      state: >
        {% set power = states('sensor.inverter_power') %}
        {{ power not in ['unavailable', 'unknown', 'None'] }}

# Fronius Solar Production Sensors
- sensor:

    - name: "Fronius Solar Power"
      unique_id: fronius_solar_power
      icon: mdi:solar-power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set dc1 = states('sensor.fronius_dc_power_1') | float(default=0) %}
        {% set dc2 = states('sensor.fronius_dc_power_2') | float(default=0) %}
        {% set sf = states('sensor.fronius_dc_sf') | float(default=0) %}
        
        {% if dc1 == 65535 %} {% set dc1 = 0 %} {% endif %}
        {% if dc2 == 65535 %} {% set dc2 = 0 %} {% endif %}
        
        {% set total_dc = dc1 + dc2 %}
        
        {{ (total_dc * (10 ** sf)) | round(0) }}

    - name: "Fronius Debug"
      unique_id: fronius_debug
      state: >
        DC1: {{ states('sensor.fronius_dc_power_1') }}
        DC2: {{ states('sensor.fronius_dc_power_2') }}
        SF: {{ states('sensor.fronius_dc_sf') }}

    - name: "Total Solar Power"
      unique_id: total_solar_power
      icon: mdi:solar-power-variant
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ states('sensor.fronius_solar_power') not in ['unavailable', 'unknown', none] 
           or states('sensor.inverter_power') not in ['unavailable', 'unknown', none] }}
      state: >
        {% set fronius = states('sensor.fronius_solar_power') | float(default=0) %}
        {% set deye = states('sensor.inverter_power') | float(default=0) %}
        {{ (fronius + deye) | round(0) }}

    - name: "Fronius Solar Status"
      unique_id: fronius_solar_status
      icon: mdi:state-machine
      availability: >
        {{ states('sensor.fronius_solar_power') not in ['unavailable', 'unknown', none] }}
      state: >
        {% set power = states('sensor.fronius_solar_power') | float(default=0) %}
        {% if power > 50 %}
          Producing
        {% elif power > 0 %}
          Low Production
        {% else %}
          Offline
        {% endif %}

- binary_sensor:
    - name: "Fronius Solar Online"
      unique_id: fronius_solar_online
      device_class: connectivity
      state: >
        {% set power = states('sensor.fronius_solar_power') %}
        {{ power not in ['unavailable', 'unknown', none] }}

# Unified battery control mode coordinator
- sensor:
    - name: "Battery Control Mode"
      unique_id: battery_control_mode
      icon: mdi:state-machine
      state: >
        {# Use car_charging_stable (hysteresis-protected) to prevent mode flapping #}
        {% set car_charging = is_state('binary_sensor.car_charging_stable', 'on') %}
        {% set wallbox_not_eco = not is_state('select.wattpilot_charging_mode', 'Eco') %}
        {% set should_charge = is_state('binary_sensor.should_start_charging', 'on') %}
        {% set is_charging = is_state('input_boolean.battery_charging_active', 'on') %}
        {% set should_stop = is_state('binary_sensor.should_stop_charging', 'on') %}
        {% set automation_on = is_state('input_boolean.battery_automation_on', 'on') %}
        {% set manual_charge = is_state('input_boolean.manual_battery_charge', 'on') %}
        {% set should_charge_during_car = is_state('binary_sensor.should_charge_battery_during_car_charging', 'on') %}

        {# Priority order: Manual > Car+Battery > Car Only > Battery > Normal #}
        {% if not is_state('binary_sensor.grid_control_ready', 'on') %}
          normal
        {% elif manual_charge %}
          manual_charging
        {% elif car_charging and wallbox_not_eco and automation_on %}
          {% if (should_charge or is_charging) and should_charge_during_car %}
            car_and_battery_charging
          {% else %}
            car_charging_only
          {% endif %}
        {% elif (should_charge or (is_charging and not should_stop)) and automation_on %}
          battery_charging
        {% else %}
          normal
        {% endif %}

# Smart decision for charging battery during car charging
- binary_sensor:
    - name: "Should Charge Battery During Car Charging"
      unique_id: should_charge_battery_during_car_charging
      icon: mdi:ev-station
      state: >
        {% set car_raw = states('sensor.wattpilot_charging_power') %}
        {% set house_raw = states('sensor.house_consumption') %}
        {% set charge_raw = states('input_number.battery_charge_rate_max') %}
        {% set capacity_raw = states('input_number.grid_connection_capacity') %}
        {% set car_power = car_raw | float(default=-1) %}
        {% set home_power = house_raw | float(default=-1) %}
        {% set charge_power = charge_raw | float(default=-1) %}
        {% set capacity = capacity_raw | float(default=-1) %}
        {# Missing power must not become zero and invent spare grid capacity. #}
        {% set load_valid = is_number(car_raw) and is_number(house_raw)
             and is_number(charge_raw) and is_number(capacity_raw)
             and is_number(states('sensor.reading_energy_main_meter'))
             and is_number(states('sensor.reading_energy_inverter_ac_output'))
             and car_power >= 0 and home_power >= 0 and charge_power > 0 and capacity > 0 %}
        {% set load_ok = load_valid and (car_power + home_power + charge_power) < capacity * 0.9 %}
        {% set price_raw = states('sensor.tibber_cached_energy_prices') %}
        {% set average_raw = states('sensor.tibber_energy_average_price_next_12_hours') %}
        {% set price_valid = is_state('binary_sensor.tibber_cached_price_data_valid', 'on')
             and is_number(price_raw) and is_number(average_raw) %}
        {# Current tariff is EUR/kWh; the average sensor is already Cent/kWh. #}
        {% set price_very_low = price_valid and (price_raw | float(default=999) * 100)
             < (average_raw | float(default=0)) * 0.8 %}
        {% set soc = states('sensor.reading_energy_battery_soc_scaled') | float(default=-1) %}
        {% set reserve = states('input_number.soc_target_default') | float(default=15) %}
        {# Match Should Start Charging: reserve recovery is protective, not a
           cheap-price optimization. Capacity and telemetry gates still apply. #}
        {% set reserve_breached = 0 < soc < (reserve - 5) * 100 %}
        {# Keep recovery allowed up to reserve; crossing the start threshold
           must not cancel the charge halfway to its target. #}
        {% set reserve_recovery = reserve_breached or
             (is_state('input_boolean.battery_charging_active', 'on') and 0 < soc < reserve * 100) %}
        {{ load_ok and 0 < soc <= 10000 and (price_very_low or reserve_recovery) }}

# Surplus discharge budget for summer/strong-solar nights.
# Intent: if the battery clearly contains more energy than the house is likely
# to use before solar production returns, allow a small price-aware extra
# discharge budget. This keeps the existing "house from battery, car from grid"
# protection intact, while avoiding carrying unused surplus into a strong solar
# morning where it would only reduce PV headroom.
- sensor:
    - name: "Battery Surplus Discharge Power"
      unique_id: battery_surplus_discharge_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      icon: mdi:battery-arrow-down-outline
      state: >
        {% set model_stamp = as_timestamp(states('sensor.reutlingen_energy_model'), default=0) | float(0) %}
        {% set model_valid = 0 <= as_timestamp(now()) - model_stamp < 900 %}
        {% set d = state_attr('sensor.reutlingen_energy_model', 'surplus') or {} %}
        {% set reserve_soc = states('input_number.soc_target_default') | float(15) %}
        {% set current_soc = states('sensor.batterie_soc') | float(0) %}
        {% set raw_soc = states('sensor.reading_energy_battery_soc_scaled') | float(-1) %}
        {% set current_soc = [current_soc, raw_soc / 100] | min if 0 < raw_soc <= 10000 and 0 < current_soc <= 100 else 0 %}
        {% set extra_cap_w = states('input_number.battery_surplus_extra_discharge_cap_w') | float(1000) %}
        {% set extra_cap_w = extra_cap_w if 0 < extra_cap_w <= 6000 else 1000 %}
        {% set price_data_valid = is_state('binary_sensor.tibber_cached_price_data_valid', 'on') %}
        {% set current_price_cents = states('sensor.tibber_cached_energy_prices') | float(999) * 100 %}
        {% set percentile = states('sensor.tibber_energy_price_percentile_next_12_hours') | float(100) %}
        {% set price_factor = 0.25 if not price_data_valid else (0 if current_price_cents < 0 else (0.15 if percentile <= 25 else (0.35 if percentile <= 50 else (0.50 if percentile <= 80 else 0.75)))) %}
        {% set hours = d.get('hours_to_solar', 0) %}
        {% set current_available = [(current_soc - reserve_soc) / 100 * (states('input_number.battery_capacity_wh') | float(10000)) - d.get('required_until_solar_wh', 0) - d.get('safety_margin_wh', 700), 0] | max %}
        {% set surplus = [d.get('surplus_wh', 0), current_available * d.get('discharge_efficiency', 0.95)] | min %}
        {% set enabled = model_valid and d.get('active_window', false) and d.get('solar_recovery_ok', false)
          and is_state('binary_sensor.inverter_data_valid', 'on')
          and not is_state('input_boolean.manual_battery_charge', 'on')
          and not is_state('input_boolean.battery_charging_active', 'on')
          and current_soc >= reserve_soc + 5 and hours > 0.25 and surplus > 0 %}
        {% set power = [[surplus / hours * price_factor, extra_cap_w] | min, 0] | max if enabled else 0 %}
        {{ power | round(0) }}
      attributes:
        calculation_data: >
          {% set model_stamp = as_timestamp(states('sensor.reutlingen_energy_model'), default=0) | float(0) %}
          {% set model_valid = 0 <= as_timestamp(now()) - model_stamp < 900 %}
          {% set d = state_attr('sensor.reutlingen_energy_model', 'surplus') or {} %}
          {% set reserve_soc = states('input_number.soc_target_default') | float(15) %}
          {% set current_soc = states('sensor.batterie_soc') | float(0) %}
          {% set raw_soc = states('sensor.reading_energy_battery_soc_scaled') | float(-1) %}
          {% set current_soc = [current_soc, raw_soc / 100] | min if 0 < raw_soc <= 10000 and 0 < current_soc <= 100 else 0 %}
          {% set extra_cap_w = states('input_number.battery_surplus_extra_discharge_cap_w') | float(1000) %}
          {% set extra_cap_w = extra_cap_w if 0 < extra_cap_w <= 6000 else 1000 %}
          {% set price_data_valid = is_state('binary_sensor.tibber_cached_price_data_valid', 'on') %}
          {% set current_price_cents = states('sensor.tibber_cached_energy_prices') | float(999) * 100 %}
          {% set percentile = states('sensor.tibber_energy_price_percentile_next_12_hours') | float(100) %}
          {% set price_factor = 0.25 if not price_data_valid else (0 if current_price_cents < 0 else (0.15 if percentile <= 25 else (0.35 if percentile <= 50 else (0.50 if percentile <= 80 else 0.75)))) %}
          {% set hours = d.get('hours_to_solar', 0) %}
          {% set current_available = [(current_soc - reserve_soc) / 100 * (states('input_number.battery_capacity_wh') | float(10000)) - d.get('required_until_solar_wh', 0) - d.get('safety_margin_wh', 700), 0] | max %}
          {% set surplus = [d.get('surplus_wh', 0), current_available * d.get('discharge_efficiency', 0.95)] | min %}
          {% set enabled = model_valid and d.get('active_window', false) and d.get('solar_recovery_ok', false)
            and is_state('binary_sensor.inverter_data_valid', 'on')
            and not is_state('input_boolean.manual_battery_charge', 'on')
            and not is_state('input_boolean.battery_charging_active', 'on')
            and current_soc >= reserve_soc + 5 and hours > 0.25 and surplus > 0 %}
          {% set power = [[surplus / hours * price_factor, extra_cap_w] | min, 0] | max if enabled else 0 %}
          {{ dict(d, model_valid=model_valid, enabled=enabled, price_factor=price_factor, extra_cap_w=extra_cap_w, power_w=power | round(0)) }}

# Dynamic discharge limit based on price and battery level
- sensor:
    - name: "Discharge Limit Percentage"
      unique_id: discharge_limit_percentage
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:battery-arrow-down
      state: >
        {# Dynamic discharge limit based on house load and car charging state #}
        {# Goal: House from battery, Car from grid (billed to employer) #}
        {% set car_charging = is_state('binary_sensor.car_charging_stable', 'on') %}
        {# % base must match the inverter's actual enforcement base (WChaMax), #}
        {# not a hardcoded assumption — falls back to 10240 W if the register #}
        {# is unavailable/garbage (< 1000 W). #}
        {% set raw_max_power = states('sensor.reading_max_allowed_discharge_power') | float(default=10240) %}
        {% set battery_max_power = raw_max_power if raw_max_power >= 1000 else 10240 %}

        {% if not car_charging %}
          {{ 100 }}
        {% else %}
          {# Prefer the smoothed house-load sensor (3-min moving average) to avoid #}
          {# feeding car-power fluctuations into the limit; fall back to the #}
          {# signed grid + inverter AC + balcony AC - wallbox balance when unavailable. #}
          {% set smoothed_house_load = states('sensor.house_consumption_smoothed') | float(default=-1) %}
          {% set surplus_extra_power = states('sensor.battery_surplus_discharge_power') | float(default=0) %}
          {% if smoothed_house_load >= 0 %}
            {% set house_load = smoothed_house_load %}
          {% else %}
            {# Calculate true house load (source-independent) #}
            {# Use the same signed balance as House Consumption: export reduces load. #}
            {% set grid_power = states('sensor.reading_energy_main_meter') | float(default=0) %}
            {% set ac_output = states('sensor.reading_energy_inverter_ac_output') | float(default=0) %}
            {% set wallbox_power = states('sensor.wattpilot_charging_power') | float(default=0) %}
            {% set balcony = states('sensor.balkonkraftwerk_power') | float(default=0) %}
            {% set total_consumption = grid_power + ac_output + balcony %}
            {% set house_load = [total_consumption - wallbox_power, 0] | max %}
          {% endif %}

          {# Baseline covers house load only. The surplus sensor may add a small #}
          {# price-aware budget when the battery is clearly overfilled for the #}
          {# remaining night and a strong solar recovery is forecast. #}
          {% set allowed_battery_power = (house_load * 1.15) + surplus_extra_power %}
          {% set desired_limit = (allowed_battery_power / battery_max_power * 100) | round(1) %}
          {# Clamp between 1% (minimum to keep battery responsive) and 100% #}
          {{ [[desired_limit, 1.0] | max, 100] | min }}
        {% endif %}


# Enhanced profitability calculation
- binary_sensor:
    - name: "Battery Charging Is Profitable Enhanced"
      unique_id: battery_charging_is_profitable_enhanced
      icon: mdi:cash-check
      state: >
        {% set current_price_cents = states('sensor.tibber_cached_energy_prices') | float(default=999) * 100 %}
        {% set max_price_24h_cents = states('sensor.tibber_energy_highest_price_next_24_hours') | float(default=0) %}
        {% set avg_price_12h_cents = states('sensor.tibber_energy_average_price_next_12_hours') | float(default=999) %}

        {# Guard: if price data unavailable, don't charge speculatively #}
        {% if max_price_24h_cents <= 0 or avg_price_12h_cents >= 999 %}
          false
        {% else %}
          {# System parameters (all values in Cent/kWh) #}
          {% set round_trip_efficiency = 0.90 %}
          {% set battery_wear_cost_cents = states('input_number.battery_wear_cost_per_kwh') | float(default=2) %}
          {% set min_spread_factor = 1.20 %}

          {# Effective costs #}
          {% set effective_charge_cost_cents = current_price_cents + battery_wear_cost_cents %}
          {% set effective_discharge_value_cents = max_price_24h_cents * round_trip_efficiency %}

          {# Profitable if: discharge value > charge cost #}
          {# Value of stored energy = Highest future price * Efficiency #}
          {# Cost of stored energy = Current price + Wear cost #}
          {% set discharge_value = max_price_24h_cents * round_trip_efficiency %}
          {% set charge_cost = current_price_cents + battery_wear_cost_cents %}

          {# Profitable if we can sell/use it later for more than it costs now #}
          {{ discharge_value > charge_cost }}
        {% endif %}

# Energy Flow Sensors for Visualization
- sensor:
    - name: "Grid Power"
      unique_id: grid_power_flow
      icon: mdi:transmission-tower
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set main_meter = states('sensor.reading_energy_main_meter') | float(default=0) %}
        {{ main_meter | round(0) }}

    - name: "Battery Power"
      unique_id: battery_power_flow
      icon: mdi:battery
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set charging_state = states('sensor.charging_state') %}
        {% set ac_output = states('sensor.reading_energy_inverter_ac_output') | float(default=0) %}
        {% set solar_power = states('sensor.fronius_solar_power') | float(default=0) %}

        {# Estimate battery power from the inverter-side balance only: the battery #}
        {# sits behind the inverter, so charge power = DC solar minus AC output    #}
        {# (negative AC output = inverter drawing from the grid to charge).        #}
        {# Grid/house/wallbox flows are on the meter side and must NOT enter this  #}
        {# balance — the old formula added grid_power, overcounting by the house   #}
        {# load (log 2026-07-07 01:30: 1299 W computed vs ~500 W true) and showing #}
        {# phantom +5 kW while the car charged on 2026-07-06 15:30.                #}
        {# Positive = charging, Negative = discharging #}
        {% if charging_state in ['CHARGING', 'DISCHARGING'] %}
          {{ (solar_power - ac_output) | round(0) }}
        {% else %}
          0
        {% endif %}

    - name: "House Consumption"
      unique_id: house_consumption_power
      icon: mdi:home
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set grid_power = states('sensor.reading_energy_main_meter') | float(default=0) %}
        {% set ac_output = states('sensor.reading_energy_inverter_ac_output') | float(default=0) %}
        {% set wallbox_power = states('sensor.wattpilot_charging_power') | float(default=0) %}

        {# House consumption = signed grid power + inverter AC output - wallbox #}
        {# The wallbox is grid-fed, so ac_output alone goes negative while the car charges #}
        {% set balcony = states('sensor.balkonkraftwerk_power') | float(0) %}
        {% set house_consumption = grid_power + ac_output + balcony - wallbox_power %}
        {{ [house_consumption, 0] | max | round(0) }}

    - name: "Solar To Battery"
      unique_id: solar_to_battery_flow
      icon: mdi:solar-power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set charge = states('sensor.battery_charge_power') | float(0) %}
        {% set grid_charge = states('sensor.grid_to_battery') | float(0) %}
        {{ [charge - grid_charge, 0] | max | round(0) }}

    - name: "Solar To House"
      unique_id: solar_to_house_flow
      icon: mdi:solar-power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set solar = states('sensor.total_solar_power') | float(0) %}
        {% set charging = states('sensor.solar_to_battery') | float(0) %}
        {% set house = states('sensor.house_consumption') | float(0) %}
        {{ [[solar - charging, 0] | max, house] | min | round(0) }}

    - name: "Solar To Grid"
      unique_id: solar_to_grid_flow
      icon: mdi:solar-power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set solar_power = states('sensor.total_solar_power') | float(default=0) %}
        {% set grid_power = states('sensor.reading_energy_main_meter') | float(default=0) %}
        
        {% if grid_power < 0 %}
          {# Negative grid = export #}
          {{ (grid_power | abs) | round(0) }}
        {% else %}
          0
        {% endif %}

    - name: "Battery To House"
      unique_id: battery_to_house_flow
      icon: mdi:battery-arrow-up
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set discharge = states('sensor.battery_discharge_power') | float(0) %}
        {% set house = states('sensor.house_consumption') | float(0) %}
        {{ [discharge, house] | min | round(0) }}

    - name: "Grid To House"
      unique_id: grid_to_house_flow
      icon: mdi:transmission-tower
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set imported = [states('sensor.reading_energy_main_meter') | float(0), 0] | max %}
        {% set grid_charge = states('sensor.grid_to_battery') | float(0) %}
        {% set wallbox = states('sensor.wattpilot_charging_power') | float(0) %}
        {% set house = states('sensor.house_consumption') | float(0) %}
        {{ [[imported - grid_charge - wallbox, 0] | max, house] | min | round(0) }}

    - name: "Grid To Battery"
      unique_id: grid_to_battery_flow
      icon: mdi:transmission-tower
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      availability: >
        {{ is_number(states('sensor.reading_energy_main_meter'))
           and is_number(states('sensor.reading_energy_inverter_ac_output'))
           and is_number(states('sensor.battery_charge_power'))
           and is_state('binary_sensor.inverter_data_valid', 'on') }}
      state: >
        {% set grid_import = [states('sensor.reading_energy_main_meter') | float(0), 0] | max %}
        {% set inverter_import = [-(states('sensor.reading_energy_inverter_ac_output') | float(0)), 0] | max %}
        {% set charge = [states('sensor.battery_charge_power') | float(0), 0] | max %}
        {# Only AC imported by the hybrid inverter can be grid charging. #}
        {# Bound by both meter import and battery charge; exclude EV/house load. #}
        {{ [grid_import, inverter_import, charge] | min | round(0) }}

    - name: "Wallbox Power"
      unique_id: wallbox_power_consumption
      icon: mdi:ev-station
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {# Wrap Wattpilot sensor for consistency with other flow sensors #}
        {# Allows for future processing (e.g., filtering, smoothing) if needed #}
        {{ states('sensor.wattpilot_charging_power') | float(default=0) | round(0) }}

    # Helper Power Sensors for Energy Integration (Riemann Sum)
    - name: "Grid Import Power"
      unique_id: grid_import_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set p = states('sensor.grid_power') | float(default=0) %}
        {% if p > 0 %} {{ p }} {% else %} 0 {% endif %}

    - name: "Grid Export Power"
      unique_id: grid_export_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set p = states('sensor.grid_power') | float(default=0) %}
        {% if p < 0 %} {{ p | abs }} {% else %} 0 {% endif %}

    - name: "Battery Charge Power"
      unique_id: battery_charge_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set p = states('sensor.battery_power') | float(default=0) %}
        {% set state = states('sensor.charging_state') %}
        {% if state == 'CHARGING' %} {{ p | abs }} {% else %} 0 {% endif %}

    - name: "Battery Discharge Power"
      unique_id: battery_discharge_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% set p = states('sensor.battery_power') | float(default=0) %}
        {% set state = states('sensor.charging_state') %}
        {% if state == 'DISCHARGING' %} {{ p | abs }} {% else %} 0 {% endif %}

# Sankey Chart Debug Sensors
# NOTE: Entity list is repeated in state and each attribute due to Home Assistant template limitations.
# When updating entities, update ALL occurrences of the list below.
- sensor:
    - name: "Sankey Battery Discharge"
      unique_id: sankey_battery_discharge
      icon: mdi:battery-arrow-down
      unit_of_measurement: W
      device_class: power
      state: >
        {% set battery_power = states('sensor.battery_power') | float(default=0) %}
        {% if battery_power < 0 %}
          {{ (battery_power | abs) | round(0) }}
        {% else %}
          0
        {% endif %}

    - name: "Sankey Grid Import"
      unique_id: sankey_grid_import
      icon: mdi:transmission-tower
      unit_of_measurement: W
      device_class: power
      state: >
        {% set grid_power = states('sensor.grid_power') | float(default=0) %}
        {% if grid_power > 0 %}
          {{ grid_power | round(0) }}
        {% else %}
          0
        {% endif %}

    - name: "Sankey Entity Check"
      unique_id: sankey_entity_check
      icon: mdi:chart-sankey-variant
      state: >
        {# ENTITY LIST - Keep in sync across all attributes #}
        {% set entities = [
          'sensor.total_solar_power',
          'sensor.sankey_grid_import',
          'sensor.sankey_battery_discharge',
          'sensor.solar_to_house',
          'sensor.solar_to_battery',
          'sensor.solar_to_grid',
          'sensor.grid_to_house',
          'sensor.grid_to_battery',
          'sensor.battery_to_house',
          'sensor.house_consumption'
        ] %}
        {% set numeric_pattern = '^-?\\d+\\.?\\d*$' %}
        {% set ns = namespace(unavailable=[], invalid=[]) %}
        {% for entity in entities %}
          {% if states(entity) in ['unavailable', 'unknown', 'none', 'None', None, ''] %}
            {% set ns.unavailable = ns.unavailable + [entity] %}
          {% elif not (states(entity) | regex_match(numeric_pattern)) %}
            {% set ns.invalid = ns.invalid + [entity] %}
          {% endif %}
        {% endfor %}
        {% if ns.unavailable | length > 0 or ns.invalid | length > 0 %}
          ERROR
        {% else %}
          OK
        {% endif %}
      attributes:
        unavailable_entities: >
          {# ENTITY LIST - Keep in sync across all attributes #}
          {% set entities = [
            'sensor.total_solar_power',
            'sensor.sankey_grid_import',
            'sensor.sankey_battery_discharge',
            'sensor.solar_to_house',
            'sensor.solar_to_battery',
            'sensor.solar_to_grid',
            'sensor.grid_to_house',
            'sensor.grid_to_battery',
            'sensor.battery_to_house',
            'sensor.house_consumption'
          ] %}
          {% set ns = namespace(unavailable=[]) %}
          {% for entity in entities %}
            {% if states(entity) in ['unavailable', 'unknown', 'none', 'None', None, ''] %}
              {% set ns.unavailable = ns.unavailable + [entity] %}
            {% endif %}
          {% endfor %}
          {{ ns.unavailable }}
        invalid_entities: >
          {# ENTITY LIST - Keep in sync across all attributes #}
          {% set entities = [
            'sensor.total_solar_power',
            'sensor.sankey_grid_import',
            'sensor.sankey_battery_discharge',
            'sensor.solar_to_house',
            'sensor.solar_to_battery',
            'sensor.solar_to_grid',
            'sensor.grid_to_house',
            'sensor.grid_to_battery',
            'sensor.battery_to_house',
