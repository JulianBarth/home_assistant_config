#
# Home energy dashboard. Automations and entity IDs are unchanged.
# Four primary views; linked subviews preserve detailed monitoring and service tools.
title: Home energy
views:
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    type: sections
    max_columns: 3
    dense_section_placement: false
    theme: Energy calm
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |
              {% set grid = states('sensor.grid_connection_status') %}
              {% if grid != 'grid' %}
              ### Grid control paused
              {{ 'The house is in island operation. Grid charging is blocked.' if grid == 'island' else 'Grid conditions are not confirmed. Grid charging is paused.' }}
              {% endif %}
              {% if is_state('input_boolean.car_boost_suppressed', 'on') %}
              ### Car solar boost paused
              The car drew no power during its last boost. Reconnect the car to allow another boost.
              {% endif %}
              {% if is_state('binary_sensor.tibber_pulse_not_functioning', 'on') %}
              ### Check Tibber Pulse
              Meter telemetry needs attention. Open Settings → Diagnostics for details.
              {% endif %}
            visibility:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.grid_connection_status
                    state_not: grid
                  - condition: state
                    entity: input_boolean.car_boost_suppressed
                    state: 'on'
                  - condition: state
                    entity: binary_sensor.tibber_pulse_not_functioning
                    state: 'on'
            grid_options:
              columns: full
              rows: auto
          - type: custom:energy-status-card
            grid_options:
              columns: full
              rows: auto
          - type: custom:energy-flow-card
            compact: true
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 1
        cards:
          - type: entities
            title: Controls
            show_header_toggle: false
            entities:
              - entity: input_boolean.battery_automation_on
                name: Automatic battery charging
              - entity: input_boolean.manual_battery_charge
                name: Manual charging
              - entity: input_boolean.car_smart_charging_on
                name: Smart car charging
            grid_options:
              columns: full
              rows: auto
          - type: conditional
            conditions:
              - entity: input_boolean.manual_battery_charge
                state: 'on'
            card:
              type: entities
              title: Manual charging target
              show_header_toggle: false
              entities:
                - entity: input_number.manual_charge_target_soc
                  name: Charge to
            grid_options:
              columns: full
              rows: auto
          - type: markdown
            content: |
              {% set price = states('sensor.tibber_cached_energy_prices') %}
              {% set power = states('sensor.wattpilot_charging_power') %}
              {% if is_state('input_boolean.car_cheap_grid_active', 'on') %}
              **Cheap-grid charging**
              {% if is_state('binary_sensor.tibber_cached_price_data_valid', 'on') and is_number(price) %}
              {{ (price | float * 100) | round(1) }} ct/kWh ·
              {% else %}
              Price unavailable ·
              {% endif %}
              {{ (power | float / 1000) | round(2) ~ ' kW' if is_number(power) else 'Power unavailable' }}
              {% elif is_state('input_boolean.car_boost_active', 'on') %}
              **Solar boost running**
              {% set budget = states('sensor.car_boost_energy_budget') %}
              {{ (budget | float / 1000) | round(1) ~ ' kWh available from the home battery.' if is_number(budget) else 'Boost budget unavailable.' }}
              {% elif is_state('input_boolean.car_boost_suppressed', 'on') %}
              **Solar boost paused**
              Reconnect the car to allow another boost.
              {% elif is_state('input_boolean.car_smart_charging_on', 'off') %}
              **Smart charging disabled**
              {% elif is_state('binary_sensor.wattpilot_33175380_stecker', 'on') %}
              **Connected, waiting**
              Waiting for solar surplus, a viable boost, or a cheap-grid window.
              {% elif is_state('binary_sensor.wattpilot_33175380_stecker', 'off') %}
              **Car disconnected**
              {% else %}
              **Connection status unavailable**
              {% endif %}
            title: Car charging
            grid_options:
              columns: full
              rows: auto
          - type: button
            name: Charging details
            icon: mdi:lightning-bolt
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /energy-overview/charging_logic
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Energy details
            icon: mdi:transmission-tower
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /energy-overview/energy_flow
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Price & Solar Forecast (next 36h)
              show_states: false
            graph_span: 36h
            span:
              start: hour
              offset: -2h
            now:
              show: true
              label: now
            apex_config:
              legend:
                show: true
                position: bottom
                fontSize: 12px
              chart:
                fontFamily: inherit
                toolbar:
                  show: false
            yaxis:
              - id: price
                decimals: 0
                apex_config:
                  title:
                    text: ct/kWh
              - id: solar
                opposite: true
                min: 0
                decimals: 1
                apex_config:
                  title:
                    text: kW
            series:
              - entity: sensor.tibber_cached_energy_prices
                name: Price
                unit: ct/kWh
                yaxis_id: price
                color: '#5299de'
                type: line
                curve: stepline
                extend_to: false
                data_generator: |
                  const prices = (entity.attributes.today || []).concat(entity.attributes.tomorrow || []);
                  return prices.map(p => [new Date(p.startsAt).getTime(), Math.round(p.total * 10000) / 100]);
              - entity: input_number.car_cheap_grid_max_price_ct
                name: Cheap-grid ceiling
                unit: ct/kWh
                yaxis_id: price
                color: '#a08ae7'
                type: line
                curve: stepline
                stroke_width: 1
                stroke_dash: 4
                data_generator: |
                  const v = Number(entity.state);
                  return [[start.getTime(), v], [end.getTime(), v]];
              - entity: sensor.solcast_pv_forecast_prognose_heute
                name: Solar forecast
                unit: kW
                yaxis_id: solar
                color: '#d59619'
                type: area
                curve: smooth
                opacity: 0.25
                stroke_width: 1
                data_generator: |
                  const today = entity.attributes.detailedForecast || [];
                  const tomorrowEnt = hass.states['sensor.solcast_pv_forecast_prognose_morgen'];
                  const tomorrow = (tomorrowEnt && tomorrowEnt.attributes.detailedForecast) || [];
                  return today.concat(tomorrow).map(p => [new Date(p.period_start).getTime(), p.pv_estimate]);
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            title: Grid charging price advantage
            content: |
              {% set d = state_attr('sensor.battery_charge_cycle_tracker', 'data') %}
              {% if d and d.month_cycles | default(0) > 0 %}
              **This month:** {{ d.month_kwh | round(2) }} kWh estimated grid charge in {{ d.month_cycles }}
              cycle{{ 's' if d.month_cycles != 1 }} for {{ d.month_cost_eur | round(2) }} € —
              **{{ d.month_saved_eur | round(2) }} € price advantage** vs day-average prices.
              Estimate before storage losses, wear and export opportunity cost.
              Measured since {{ d.get('measured_since', 'unknown') }}; earlier totals are retained separately.
              {% set c = d.last_cycle %}
              {% if c %}

              Last cycle: {{ c.kwh }} kWh @ {{ c.avg_price_ct }} ct/kWh
              (day avg {{ c.day_avg_ct }} ct) → {{ c.saved_eur | round(2) }} € price advantage.
              {% endif %}
              {% else %}
              *No completed charge cycles this month yet.*
              {% endif %}
            grid_options:
              columns: full
              rows: auto
          - type: button
            name: View history
            icon: mdi:chart-line
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /energy-overview/monitoring
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Preferences
            icon: mdi:cog-outline
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /energy-overview/configuration
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
    header:
      layout: responsive
      card:
        type: markdown
        text_only: true
        content: |-
          # Overview
          Your home energy, clearly.
  - title: Energy
    path: energy_flow
    icon: mdi:transmission-tower
    type: sections
    max_columns: 3
    dense_section_placement: false
    theme: Energy calm
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:energy-flow-card
            grid_options:
              columns: full
              rows: auto
          - type: custom:apexcharts-card
            header:
              show: true
              title: Energy Flow History (2h)
            graph_span: 2h
            series:
              - entity: sensor.total_solar_power
                name: Solar
                unit: kW
                stroke_width: 2
                curve: straight
                transform: 'return x == null || !Number.isFinite(Number(x)) ? null : Number(x) / 1000;'
                group_by:
                  func: avg
                  duration: 5min
                color: '#d59619'
              - entity: sensor.grid_power
                name: Grid
                unit: kW
                stroke_width: 2
                curve: straight
                transform: 'return x == null || !Number.isFinite(Number(x)) ? null : Number(x) / 1000;'
                group_by:
                  func: avg
                  duration: 5min
                color: '#5299de'
              - entity: sensor.battery_power
                name: Battery
                unit: kW
                stroke_width: 2
                curve: straight
                transform: 'return x == null || !Number.isFinite(Number(x)) ? null : Number(x) / 1000;'
                group_by:
                  func: avg
                  duration: 5min
                color: '#21aa86'
              - entity: sensor.house_consumption
                name: House
                unit: kW
                stroke_width: 2
                curve: straight
                transform: 'return x == null || !Number.isFinite(Number(x)) ? null : Number(x) / 1000;'
                group_by:
                  func: avg
                  duration: 5min
                color: '#ed8761'
              - entity: sensor.wallbox_power
                name: Wallbox
                unit: kW
                stroke_width: 2
                curve: straight
                transform: 'return x == null || !Number.isFinite(Number(x)) ? null : Number(x) / 1000;'
                group_by:
                  func: avg
                  duration: 5min
                color: '#a08ae7'
            yaxis:
              - decimals: 1
                apex_config:
                  title:
                    text: kW
            grid_options:
              columns: full
              rows: auto
            apex_config:
              chart:
                fontFamily: inherit
                toolbar:
                  show: false
              legend:
                show: true
                position: bottom
                fontSize: 12px
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Explore energy
            heading_style: title
            icon: mdi:solar-power-variant
            grid_options:
              columns: full
              rows: auto
          - type: button
            name: Solar production
            icon: mdi:solar-power
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /energy-overview/solar
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Energy history
            icon: mdi:chart-line
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /energy-overview/monitoring
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: entities
            title: Flow Details
            show_header_toggle: false
            state_color: true
            entities:
              - type: section
                label: Solar Flows
              - entity: sensor.solar_to_house
                name: Solar → House
                icon: mdi:arrow-right
              - entity: sensor.solar_to_battery
                name: Solar → Battery
                icon: mdi:arrow-right
              - entity: sensor.solar_to_grid
                name: Solar → Grid
                icon: mdi:arrow-right
              - type: divider
              - type: section
                label: Grid & Battery Flows
              - entity: sensor.grid_to_house
                name: Grid → House
                icon: mdi:arrow-right
              - entity: sensor.grid_to_battery
                name: Grid → Battery
                icon: mdi:arrow-right
              - entity: sensor.battery_to_house
                name: Battery → House
                icon: mdi:arrow-right
            grid_options:
              columns: full
              rows: auto
    header:
      layout: responsive
      card:
        type: markdown
        text_only: true
        content: |-
          # Energy
          Live power, solar production and recent trends.
  - title: Charging
    path: charging_logic
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    dense_section_placement: false
    theme: Energy calm
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:energy-status-card
            grid_options:
              columns: full
              rows: auto
          - type: custom:apexcharts-card
            header:
              show: true
              title: Battery target and electricity price (48h)
              show_states: false
            graph_span: 48h
            apex_config:
              legend:
                show: true
                position: bottom
                fontSize: 12px
              chart:
                fontFamily: inherit
                toolbar:
                  show: false
            yaxis:
              - id: pct
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: '%'
              - id: price
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: ct/kWh
            series:
              - entity: sensor.tibber_energy_prices
                name: Price
                unit: ct/kWh
                yaxis_id: price
                color: '#5299de'
                curve: stepline
                stroke_width: 2
                transform: return x * 100;
              - entity: sensor.batterie_soc
                name: Battery SoC
                yaxis_id: pct
                color: '#21aa86'
                stroke_width: 2
              - entity: sensor.computed_target_soc
                name: Smart Target
                yaxis_id: pct
                color: '#7f8b86'
                curve: stepline
                stroke_width: 1
                stroke_dash: 4
            grid_options:
              columns: full
              rows: auto
          - type: history-graph
            title: Charging modes (48h)
            hours_to_show: 48
            entities:
              - entity: input_boolean.battery_charging_active
                name: Battery charging
              - entity: input_boolean.battery_no_discharging_active
                name: Discharge limited
              - entity: input_boolean.car_boost_active
                name: Car solar boost
              - entity: input_boolean.car_cheap_grid_active
                name: Car cheap-grid charging
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 1
        cards:
          - type: entities
            title: Wallbox & Car
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.wattpilot_carconnected
                name: Status
              - entity: select.wattpilot_charging_mode
                name: Mode
              - entity: sensor.wallbox_power
                name: Charging Power
              - entity: input_boolean.battery_no_discharging_active
                name: Discharge Limited (Car)
                type: simple-entity
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: divider
              - type: section
                label: Smart Charging
              - entity: input_boolean.car_smart_charging_on
                name: Smart Charging Enabled
              - entity: sensor.car_boost_energy_budget
                name: Lendable from home battery now
              - entity: binary_sensor.car_boost_viable
                name: Boost would start / keep running
              - entity: input_boolean.car_boost_active
                name: Solar Boost running
                type: simple-entity
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - entity: binary_sensor.car_cheap_grid_window
                name: Grid price cheap enough
              - entity: input_boolean.car_cheap_grid_active
                name: Cheap-grid charging running
                type: simple-entity
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - entity: input_boolean.car_boost_suppressed
                name: Boost paused (car took no power — replug clears)
                type: simple-entity
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: divider
              - type: section
                label: Grid / Inselbetrieb
              - entity: binary_sensor.grid_available
                name: Grid available
              - entity: sensor.grid_frequency
                name: Grid frequency (island ≈ 53 Hz)
              - entity: input_datetime.grid_outage_start
                name: Last outage detected
            grid_options:
              columns: full
              rows: auto
          - type: button
            name: Detailed calculations
            icon: mdi:chart-timeline-variant-shimmer
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /energy-overview/algorithm_debug
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Charging history
            icon: mdi:chart-line
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /energy-overview/monitoring
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            title: Algorithm Decision Detail
            content: |
              {% set data = state_attr('sensor.battery_optimization_data', 'calculation_data') %}
              {% if data %}
              ## Current Decision
              **Target SoC:** {{ states('sensor.computed_target_soc') }}%
              **Reason:** {{ data.decision_reason }}

              ### Bridge Period Analysis
              | Parameter | Value |
              |-----------|-------|
              | Bridge Type | {{ data.bridge_type }} |
              | Bridge Hours | {{ data.bridge_hours }}h |
              | Consumption (bridge) | {{ data.bridge_consumption_wh }} Wh |
              | Solar Remaining | {{ data.expected_solar_wh }} Wh |
              | Usable Solar | {{ data.usable_solar_wh }} Wh |
              | Low Solar Day | {{ data.is_low_solar_day }} |
              | Energy Deficit | {{ data.energy_deficit_wh }} Wh |

              ### Price Analysis
              | Parameter | Value |
              |-----------|-------|
              | Current Price | {{ (states('sensor.tibber_cached_energy_prices') | float(0) * 100) | round(2) }} ct/kWh |
              | Next Price | {{ data.next_price_cents }} ct/kWh |
              | Price Drop | {{ data.price_drop_cents }} ct |
              | Percentile | {{ states('sensor.tibber_energy_price_percentile_next_12_hours') }}% |
              | Max Grid Target | {{ data.max_grid_target }}% |
              {% else %}
              *Waiting for data...*
              {% endif %}
            grid_options:
              columns: full
              rows: auto
          - type: entities
            title: Decision Sensors
            show_header_toggle: false
            state_color: true
            entities:
              - entity: binary_sensor.should_start_charging
                name: Should Start Charging
              - entity: binary_sensor.should_stop_charging
                name: Should Stop Charging
              - entity: binary_sensor.should_hold_battery_soc
                name: Should Hold SoC
              - entity: binary_sensor.should_prevent_discharge
                name: Should Prevent Discharge
              - type: divider
              - entity: binary_sensor.battery_charging_is_profitable_enhanced
                name: Profitable to Charge
              - entity: binary_sensor.should_charge_battery_during_car_charging
                name: Allow Charge + Car
              - entity: binary_sensor.car_charging_stable
                name: Car Charging (Stable)
              - type: divider
              - entity: sensor.discharge_limit_percentage
                name: Discharge Limit
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 1
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Electricity price comparison (24h)
            graph_span: 24h
            yaxis:
              - decimals: 1
                apex_config:
                  title:
                    text: ct/kWh
            series:
              - entity: sensor.tibber_energy_prices
                name: Current price
                unit: ct/kWh
                transform: 'return x == null || !Number.isFinite(Number(x)) ? null : Number(x) * 100;'
                color: '#5299de'
                curve: stepline
                stroke_width: 2
              - entity: sensor.tibber_energy_average_price_next_12_hours
                name: 12h average
                unit: ct/kWh
                color: '#7f8b86'
                stroke_width: 1
                stroke_dash: 4
              - entity: sensor.tibber_energy_highest_price_next_24_hours
                name: 24h maximum
                unit: ct/kWh
                color: '#ed8761'
                stroke_width: 1
            grid_options:
              columns: full
              rows: auto
            apex_config:
              chart:
                fontFamily: inherit
                toolbar:
                  show: false
              legend:
                show: true
                position: bottom
                fontSize: 12px
          - type: history-graph
            title: Solar Forecast Impact (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute
                name: Solar Remaining
            grid_options:
              columns: full
              rows: auto
          - type: history-graph
            title: Solar forecast conditions (24h)
            hours_to_show: 24
            entities:
              - entity: binary_sensor.expected_sun_low
                name: Low solar forecast
              - entity: binary_sensor.expected_sun_very_low
                name: Very low solar forecast
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 1
        cards:
          - type: conditional
            conditions:
              - entity: binary_sensor.wattpilot_33175380_stecker
                state: 'on'
            card:
              type: markdown
              title: Car Boost Decision Detail
              content: |
                {% set data = state_attr('sensor.car_boost_energy_budget', 'calculation_data') %}
                {% if data %}
                **Budget:** {{ states('sensor.car_boost_energy_budget') }} Wh &nbsp; | &nbsp;
                **Floor:** {{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') }}% &nbsp; | &nbsp;
                **Viable:** {{ states('binary_sensor.car_boost_viable') }}

                **Reason:** {{ data.decision_reason }}

                ### Budget Constraints (minimum wins)
                | Constraint | Value |
                |-----------|-------|
                | 1 — Battery above floor | {{ data.constraint_floor_wh }} Wh |
                | 2 — Tonight still covered | {{ data.constraint_overnight_wh }} Wh |
                | 3 — Sun can refill the loan | {{ data.constraint_solar_wh }} Wh |

                ### Inputs
                | Parameter | Value |
                |-----------|-------|
                | Battery SoC | {{ data.soc }}% |
                | Solar remaining today | {{ data.remaining_solar_wh }} Wh |
                | Usable (× confidence) | {{ data.usable_solar_wh }} Wh |
                | House until sunset | {{ data.house_until_sunset_wh }} Wh |
                | Solar surplus | {{ data.solar_surplus_wh }} Wh |
                | Needed at sunset | {{ data.needed_at_sunset_wh }} Wh |
                {% else %}
                *Waiting for data...*
                {% endif %}
            grid_options:
              columns: full
              rows: auto
    header:
      layout: responsive
      card:
        type: markdown
        text_only: true
        content: |-
          # Charging
          Understand the plan and what your car is doing.
  - title: Settings
    path: configuration
    icon: mdi:cog
    type: sections
    max_columns: 3
    dense_section_placement: false
    theme: Energy calm
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: entities
            title: Battery reserve
            show_header_toggle: false
            entities:
              - entity: input_number.soc_target_default
                name: Default Target
              - entity: input_number.soc_hist
                name: SoC Hysteresis
              - entity: input_number.battery_hold_threshold
                name: Hold Threshold
            grid_options:
              columns: full
              rows: auto
          - type: entities
            title: Price rules
            show_header_toggle: false
            entities:
              - entity: input_number.battery_wear_cost_per_kwh
                name: Battery Wear Cost
            grid_options:
              columns: full
              rows: auto
          - type: entities
            title: Household schedule
            show_header_toggle: false
            entities:
              - entity: input_number.night_consumption_rate_wh
                name: Night Rate
              - entity: input_number.day_consumption_rate_wh
                name: Day Rate
              - entity: input_number.weekday_wake_hour
                name: Weekday Wake
