            title: Algorithm Internals
            content: |
              {% set data = state_attr('sensor.battery_optimization_data', 'calculation_data') %}
              {% if data %}
              **Raw State:** `{{ states('sensor.battery_optimization_data') }}`
              **Decision:** {{ data.decision_reason }}

              | Field | Value | Field | Value |
              |-------|-------|-------|-------|
              | bridge_type | {{ data.bridge_type }} | bridge_hours | {{ data.bridge_hours }}h |
              | bridge_consumption | {{ data.bridge_consumption_wh }} Wh | energy_deficit | {{ data.energy_deficit_wh }} Wh |
              | expected_solar | {{ data.expected_solar_wh }} Wh | effective_solar | {{ data.effective_solar_wh }} Wh |
              | usable_solar | {{ data.usable_solar_wh }} Wh | is_low_solar | {{ data.is_low_solar_day }} |
              | current_price | {{ data.current_price_cents }} ct | next_price | {{ data.next_price_cents }} ct |
              | price_drop | {{ data.price_drop_cents }} ct | percentile | {{ data.price_percentile }}% |
              | max_grid_target | {{ data.max_grid_target }}% | current_hour | {{ data.current_hour }} |
              | is_weekend | {{ data.is_weekend }} | wake_hour | {{ data.wake_hour }} |

              **computed_target_soc:** {{ states('sensor.computed_target_soc') }}%
              **battery_target_soc (input):** {{ states('input_number.battery_target_soc') }}%
              **batterie_soc:** {{ states('sensor.batterie_soc') }}%
              **soc_scaled:** {{ states('sensor.reading_energy_battery_soc_scaled') }}
              {% else %}
              ⚠️ `calculation_data` attribute is empty or unavailable
              {% endif %}
            grid_options:
              columns: full
              rows: auto
          - type: entities
            title: Control Flags (with last-changed)
            show_header_toggle: false
            state_color: true
            entities:
              - type: section
                label: Input Boolean Flags
              - entity: input_boolean.battery_charging_active
