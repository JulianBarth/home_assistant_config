          - type: divider
          - type: section
            label: "Solar Boost — car borrows from home battery when sun will refill it"
          - entity: input_boolean.car_smart_charging_on
            name: Enable smart car charging
          - entity: input_number.car_boost_min_soc
            name: Never drain home battery below (rec. 30%)
          - entity: input_number.car_boost_floor_margin_pct
            name: Extra stop margin, SoC reads high under load (rec. 10%)
          - entity: input_number.car_boost_island_floor_soc
            name: Floor during grid outage / Inselbetrieb (rec. 80%)
          - entity: input_number.car_boost_min_budget_wh
            name: Start only if ≥ this much lendable (rec. 2000 Wh)
          - entity: input_number.car_boost_solar_confidence_pct
            name: Trust solar forecast to (rec. 70%)
          - entity: input_number.car_boost_charging_current_a
            name: Car current while boosting (rec. 6 A)
          - type: divider
          - type: section
            label: "Cheap Grid — car charges from grid when power is very cheap"
          - entity: input_number.car_cheap_grid_percentile
            name: Price among cheapest X% of next 12h (rec. 10)
          - entity: input_number.car_cheap_grid_max_price_ct
            name: …and below this price (rec. 15 ct/kWh)

      - type: markdown
        title: "ℹ️ How Car Smart Charging Works"
        content: |
          **☀️ Solar Boost** — In Eco mode the car normally waits for live PV
          surplus. When today's *forecast* shows the sun will refill the home
          battery anyway, the car may **borrow** energy from it right away
          (Wattpilot Boost, charger stays in Eco). It stops at the battery
          floor, when the borrowed budget is spent, or when the forecast no
          longer covers tonight's house consumption.

          - **Never drain below**: hard floor for the home battery — boost
            never pulls it under this SoC.
          - **Lendable energy**: how much may be borrowed right now
            (limited by floor, tonight's needs, and what the sun can refill).
          - **Trust solar forecast**: discount applied to Solcast
            (70% = plan with only 70% of the forecast, safety first).
          - **Car current while boosting**: 6 A ≈ 4.1 kW, roughly what
            battery + PV can supply without importing from grid.
            Restored to 16 A automatically after every boost.

          **💰 Cheap Grid** — When electricity is negative-priced, or both
          among the cheapest X% of the next 12 h *and* under the absolute
          ceiling, the wallbox temporarily switches **Eco → Default** and the
          car charges at full power from the grid (house keeps running on
          battery). It switches back to Eco when prices rise. If you change
          the wallbox mode manually, the automation backs off.

