# Battery Management Dashboard
title: Battery Management System
views:

  # =========================================================================
  # VIEW 1: OVERVIEW — At-a-glance system status
  # =========================================================================
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    cards:
      # --- POWER FLOW VISUALIZATION (animated) ---
      - type: custom:power-flow-card-plus
        entities:
          battery:
            entity: sensor.battery_power
            state_of_charge: sensor.batterie_soc
            icon: mdi:battery
            display_state: one_way
            color:
              icon_color: var(--state-icon-color)
            state_of_charge_unit_white_space: false
          grid:
            entity: sensor.grid_power
            icon: mdi:transmission-tower
            display_state: one_way
            color_icon: true
          solar:
            entity: sensor.total_solar_power
            icon: mdi:solar-power
            display_state: one_way
            color_icon: true
            color:
              icon_color: var(--warning-color)
          home:
            entity: sensor.house_consumption
            icon: mdi:home
            override_state: true
        clickable_entities: true
        display_zero_lines:
          mode: show
          transparency: 50
        use_new_flow_rate_model: true
        w_decimals: 0
        min_flow_rate: 0.75
        max_flow_rate: 6
        watt_threshold: 0
        kw_decimals: 1

      # --- BATTERY + ALGORITHM STATUS ---
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.batterie_soc
                name: Battery
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 20
                  red: 0
                needle: true
              - type: gauge
                entity: sensor.total_solar_power
                name: Solar
                min: 0
                max: 7000
                needle: true
                severity:
                  green: 1000
                  yellow: 100
                  red: 0

          - type: entities
            title: "⚡ System Status"
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.charging_state
                name: Battery State
              - entity: sensor.battery_control_mode
                name: Control Mode
                icon: mdi:state-machine
              - entity: sensor.computed_target_soc
                name: Smart Target SoC
                icon: mdi:target-account
              - type: divider
              - entity: sensor.tibber_energy_prices
                name: Current Price
              - entity: sensor.tibber_energy_price_percentile_next_12_hours
                name: Price Percentile (12h)

      # --- ALGORITHM DECISION (Transparency) ---
      - type: markdown
        title: "🧠 Algorithm Decision"
        content: |
          **Target:** {{ states('sensor.computed_target_soc') }}% &nbsp; | &nbsp;
          **SoC:** {{ states('sensor.batterie_soc') }}% &nbsp; | &nbsp;
          **Mode:** {{ states('sensor.battery_control_mode') }}

          {% set data = state_attr('sensor.battery_optimization_data', 'calculation_data') %}
          {% if data %}
          **Reason:** {{ data.decision_reason }}

          | Metric | Value |
          |--------|-------|
          | Bridge Period | {{ data.bridge_hours }}h ({{ data.bridge_type }}) |
          | Bridge Consumption | {{ data.bridge_consumption_wh }} Wh |
          | Solar (usable) | {{ data.usable_solar_wh }} Wh |
          | Energy Deficit | {{ data.energy_deficit_wh }} Wh |
          | Price Percentile | {{ states('sensor.tibber_energy_price_percentile_next_12_hours') }}% |
          | Price Drop | {{ data.price_drop_cents }} ct |
          {% endif %}

      # --- FUTURE PRICE & SOLAR (what the algorithm decides on) ---
      # Requires the "apexcharts-card" HACS frontend plugin and the Solcast
      # integration's detailedForecast attributes enabled.
      - type: custom:apexcharts-card
        header:
          show: true
          title: "💶 Price & Solar Forecast (next 36h)"
          show_states: false
        graph_span: 36h
        span:
          start: hour
          offset: -2h
        now:
          show: true
          label: now
        apex_config:
          legend:
            show: true
        yaxis:
          - id: price
            decimals: 0
            apex_config:
              title:
                text: ct/kWh
          - id: solar
            opposite: true
            min: 0
            decimals: 1
            apex_config:
              title:
                text: kW
        series:
          - entity: sensor.tibber_cached_energy_prices
            name: Price
            yaxis_id: price
            color: '#2196F3'
            type: line
            curve: stepline
            extend_to: false
            data_generator: |
              const prices = (entity.attributes.today || []).concat(entity.attributes.tomorrow || []);
              return prices.map(p => [new Date(p.startsAt).getTime(), Math.round(p.total * 10000) / 100]);
          - entity: input_number.car_cheap_grid_max_price_ct
            name: Cheap-grid ceiling
            yaxis_id: price
            color: '#4CAF50'
            type: line
            curve: stepline
            stroke_width: 1
            stroke_dash: 4
            data_generator: |
              const v = Number(entity.state);
              return [[start.getTime(), v], [end.getTime(), v]];
          - entity: sensor.solcast_pv_forecast_prognose_heute
            name: Solar forecast
            yaxis_id: solar
            color: '#FFB300'
            type: area
            curve: smooth
            opacity: 0.25
            stroke_width: 1
            data_generator: |
              const today = entity.attributes.detailedForecast || [];
              const tomorrowEnt = hass.states['sensor.solcast_pv_forecast_prognose_morgen'];
              const tomorrow = (tomorrowEnt && tomorrowEnt.attributes.detailedForecast) || [];
              return today.concat(tomorrow).map(p => [new Date(p.period_start).getTime(), p.pv_estimate]);

      # --- CAR STATUS CHIP ---
      - type: markdown
        content: |
          {% if is_state('input_boolean.car_cheap_grid_active', 'on') %}
          ### 💰 Car: cheap-grid charging
          {{ (states('sensor.tibber_cached_energy_prices') | float(0) * 100) | round(1) }} ct/kWh,
          wallbox {{ states('sensor.wattpilot_charging_power') | float(0) | round(0) }} W — house stays on battery.
          {% elif is_state('input_boolean.car_boost_active', 'on') %}
          ### ☀️ Car: solar boost running
          Lending battery energy — {{ states('sensor.car_boost_energy_budget') | float(0) | round(0) }} Wh budget left,
          floor {{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') | float(30) | round(0) }}%.
          {% elif is_state('input_boolean.car_boost_suppressed', 'on') %}
          ### ⏸️ Car: boost suppressed
          Car took no power during the last boost — paused until replugged.
          {% elif is_state('input_boolean.car_smart_charging_on', 'off') %}
          ### ⏹️ Car: smart charging disabled
          {% elif is_state('binary_sensor.wattpilot_33175380_stecker', 'on') %}
          ### 🔌 Car: plugged in, waiting
          Eco mode — waiting for PV surplus, a viable boost, or a cheap-grid window.
          {% else %}
          ### 🚗 Car: not plugged in
          {% endif %}

      # --- BOOST SUPPRESSED WARNING (prominent — silently blocks boosts) ---
      - type: conditional
        conditions:
          - entity: input_boolean.car_boost_suppressed
            state: "on"
        card:
          type: markdown
          content: |
            ## ⚠️ Car boost suppressed
            The car drew no power for 15 min during the last boost (likely full or paused).
            Solar boost will **not start again until the car is replugged**.

      # --- QUICK CONTROLS ---
      - type: entities
        title: "⚙️ Quick Controls"
        show_header_toggle: false
        entities:
          - entity: input_boolean.battery_automation_on
            name: Automation Enabled
          - entity: input_boolean.manual_battery_charge
            name: Manual Charge
          - entity: input_number.manual_charge_target_soc
            name: Manual Target
          - type: divider
          - entity: input_boolean.battery_charging_active
            name: Charging Active
          - entity: input_boolean.battery_no_discharging_active
            name: Discharge Limited
          - type: divider
          - entity: input_boolean.car_smart_charging_on
            name: Car Smart Charging
          - entity: input_boolean.car_boost_active
            name: Car Solar Boost Active
          - entity: input_boolean.car_cheap_grid_active
            name: Car Cheap Grid Active

      # --- SAVINGS TILE ---
      - type: markdown
        title: "💶 Charging Savings"
        content: |
          {% set d = state_attr('sensor.battery_charge_cycle_tracker', 'data') %}
          {% if d and d.month_cycles | default(0) > 0 %}
          **This month:** {{ d.month_kwh }} kWh grid-charged in {{ d.month_cycles }}
          cycle{{ 's' if d.month_cycles != 1 }} for {{ d.month_cost_eur | round(2) }} € —
          **≈ {{ d.month_saved_eur | round(2) }} € saved** vs day-average prices.
          {% set c = d.last_cycle %}
          {% if c %}

          Last cycle: {{ c.kwh }} kWh @ {{ c.avg_price_ct }} ct/kWh
          (day avg {{ c.day_avg_ct }} ct) → {{ c.saved_eur | round(2) }} € saved.
          {% endif %}
          {% else %}
          *No completed charge cycles this month yet.*
          {% endif %}

      # --- SOC HISTORY (compact) ---
      - type: history-graph
        title: "Battery SoC (24h)"
        hours_to_show: 24
        entities:
          - entity: sensor.batterie_soc
            name: SoC
          - entity: sensor.computed_target_soc
            name: Smart Target

  # =========================================================================
  # VIEW 2: ENERGY FLOW — Real-time visualization + Sankey
  # =========================================================================
  - title: Energy Flow
    path: energy_flow
    icon: mdi:chart-sankey
    cards:
      # --- SANKEY CHART ---
      - type: custom:sankey-chart
        title: "🔋 Energy Flow"
        height: 600
        wide: true
        show_names: true
        show_values: true
        show_units: true
        sections:
          - entities:
              - entity_id: sensor.total_solar_power
                name: Solar Production
                color: '#FFB300'
                children:
                  - sensor.solar_to_house
                  - sensor.solar_to_battery
                  - sensor.solar_to_grid
              - entity_id: sensor.sankey_grid_import
                name: Grid
                color: '#2196F3'
                children:
                  - sensor.grid_to_house
                  - sensor.grid_to_battery
              - entity_id: sensor.sankey_battery_discharge
                name: Battery
                color: '#4CAF50'
                children:
                  - sensor.battery_to_house
          - entities:
              - entity_id: sensor.solar_to_house
                name: "Solar → House"
                children:
                  - sensor.house_consumption
              - entity_id: sensor.solar_to_battery
                name: "Solar → Battery"
              - entity_id: sensor.solar_to_grid
                name: "Solar → Grid"
              - entity_id: sensor.grid_to_house
                name: "Grid → House"
                children:
                  - sensor.house_consumption
              - entity_id: sensor.grid_to_battery
                name: "Grid → Battery"
              - entity_id: sensor.battery_to_house
                name: "Battery → House"
                children:
                  - sensor.house_consumption
          - entities:
              - entity_id: sensor.house_consumption
                name: House
                color: '#FF5722'
        min_box_height: 3
        min_box_distance: 5

      # --- POWER FLOW HISTORY ---
      - type: history-graph
        title: "Energy Flow History (2h)"
        hours_to_show: 2
        refresh_interval: 30
        entities:
          - entity: sensor.total_solar_power
            name: Solar
          - entity: sensor.grid_power
            name: Grid
          - entity: sensor.battery_power
            name: Battery
          - entity: sensor.house_consumption
            name: House
          - entity: sensor.wallbox_power
            name: Wallbox

      # --- FLOW DETAIL ---
      - type: entities
        title: "🔄 Flow Details"
        show_header_toggle: false
        state_color: true
        entities:
          - type: section
            label: Solar Flows
          - entity: sensor.solar_to_house
            name: "Solar → House"
            icon: mdi:arrow-right
          - entity: sensor.solar_to_battery
            name: "Solar → Battery"
            icon: mdi:arrow-right
          - entity: sensor.solar_to_grid
            name: "Solar → Grid"
            icon: mdi:arrow-right
          - type: divider
          - type: section
            label: Grid & Battery Flows
          - entity: sensor.grid_to_house
            name: "Grid → House"
            icon: mdi:arrow-right
          - entity: sensor.grid_to_battery
            name: "Grid → Battery"
            icon: mdi:arrow-right
          - entity: sensor.battery_to_house
            name: "Battery → House"
            icon: mdi:arrow-right

  # =========================================================================
  # VIEW 3: SOLAR — Production details
  # =========================================================================
  - title: Solar
    path: solar
    icon: mdi:solar-power
    cards:
      - type: gauge
        entity: sensor.total_solar_power
        name: Total Solar Production
        min: 0
        max: 6800
        severity:
          green: 1000
          yellow: 100
          red: 0
        needle: true

      - type: entities
        title: "☀️ Solar Systems"
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.total_solar_power
            name: Total Power
            icon: mdi:solar-power-variant
          - type: divider
          - type: section
            label: Fronius Gen24 6.0
          - entity: sensor.fronius_solar_power
            name: Current Power
            icon: mdi:solar-panel-large
          - entity: sensor.fronius_solar_status
            name: Status
          - entity: binary_sensor.fronius_solar_online
            name: Online
          - type: divider
          - type: section
            label: Balkonkraftwerk Deye (800W)
          - entity: sensor.balkonkraftwerk_power
            name: Current Power
            icon: mdi:solar-panel
          - entity: sensor.balkonkraftwerk_daily_energy
            name: Daily Energy
          - entity: sensor.balkonkraftwerk_status
            name: Status
          - entity: binary_sensor.balkonkraftwerk_online
            name: Online

      - type: history-graph
        title: "Solar Power (24h)"
        hours_to_show: 24
        entities:
          - entity: sensor.fronius_solar_power
            name: Fronius
          - entity: sensor.balkonkraftwerk_power
            name: Balkonkraftwerk
          - entity: sensor.total_solar_power
            name: Total

      # --- FORECAST vs ACTUAL (calibrates the boost solar confidence) ---
      - type: custom:apexcharts-card
        header:
          show: true
          title: "☀️ Forecast vs Actual (today)"
          show_states: false
        graph_span: 24h
        span:
          start: day
        now:
          show: true
        apex_config:
          legend:
            show: true
        yaxis:
          - min: 0
            decimals: 1
            apex_config:
              title:
                text: kW
        series:
          - entity: sensor.solcast_pv_forecast_prognose_heute
            name: Solcast forecast
            type: area
            color: '#FFB300'
            opacity: 0.25
            stroke_width: 1
            curve: smooth
            data_generator: |
              return (entity.attributes.detailedForecast || []).map(p => [new Date(p.period_start).getTime(), p.pv_estimate]);
          - entity: sensor.total_solar_power
            name: Actual PV
            type: line
            color: '#FF5722'
            stroke_width: 2
            curve: smooth
            group_by:
              func: avg
              duration: 15min
            transform: return x / 1000;

      - type: entities
        title: "☀️ Solar Forecast"
        show_header_toggle: false
        entities:
          - entity: sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute
            name: Remaining Today
          - entity: sensor.solcast_pv_forecast_forecast_next_x_hours
            name: Forecast Next Hours
          - entity: binary_sensor.expected_sun_low
            name: Expected Sun Low
          - entity: binary_sensor.expected_sun_very_low
            name: Expected Sun Very Low

      - type: entities
        title: "Balkonkraftwerk Details"
        show_header_toggle: false
        entities:
          - entity: sensor.inverter_grid_voltage
            name: Grid Voltage
          - entity: sensor.inverter_grid_frequency
            name: Grid Frequency
          - entity: sensor.inverter_temperature
            name: Temperature

  # =========================================================================
  # VIEW 4: CHARGING LOGIC — Algorithm decision analysis
  # =========================================================================
  - title: Charging Logic
    path: charging_logic
    icon: mdi:lightning-bolt
    cards:
      # --- ALGORITHM DECISION DETAIL ---
      - type: markdown
        title: "🧠 Algorithm Decision Detail"
        content: |
          {% set data = state_attr('sensor.battery_optimization_data', 'calculation_data') %}
          {% if data %}
          ## Current Decision
          **Target SoC:** {{ states('sensor.computed_target_soc') }}%
          **Reason:** {{ data.decision_reason }}

          ### Bridge Period Analysis
          | Parameter | Value |
          |-----------|-------|
          | Bridge Type | {{ data.bridge_type }} |
          | Bridge Hours | {{ data.bridge_hours }}h |
          | Consumption (bridge) | {{ data.bridge_consumption_wh }} Wh |
          | Solar Remaining | {{ data.expected_solar_wh }} Wh |
          | Usable Solar | {{ data.usable_solar_wh }} Wh |
          | Low Solar Day | {{ data.is_low_solar_day }} |
          | Energy Deficit | {{ data.energy_deficit_wh }} Wh |

          ### Price Analysis
          | Parameter | Value |
          |-----------|-------|
          | Current Price | {{ (states('sensor.tibber_cached_energy_prices') | float(0) * 100) | round(2) }} ct/kWh |
          | Next Price | {{ data.next_price_cents }} ct/kWh |
          | Price Drop | {{ data.price_drop_cents }} ct |
          | Percentile | {{ states('sensor.tibber_energy_price_percentile_next_12_hours') }}% |
          | Max Grid Target | {{ data.max_grid_target }}% |
          {% else %}
          *Waiting for data...*
          {% endif %}

      - type: entities
        title: "Decision Sensors"
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.should_start_charging
            name: Should Start Charging
          - entity: binary_sensor.should_stop_charging
            name: Should Stop Charging
          - entity: binary_sensor.should_hold_battery_soc
            name: Should Hold SoC
          - entity: binary_sensor.should_prevent_discharge
            name: Should Prevent Discharge
          - type: divider
          - entity: binary_sensor.battery_charging_is_profitable_enhanced
            name: Profitable to Charge
          - entity: binary_sensor.should_charge_battery_during_car_charging
            name: Allow Charge + Car
          - entity: binary_sensor.car_charging_stable
            name: Car Charging (Stable)
          - type: divider
          - entity: sensor.discharge_limit_percentage
            name: Discharge Limit

      # --- PRICE vs CHARGING (48h, dual axis: ct/kWh right, % left) ---
      - type: custom:apexcharts-card
        header:
          show: true
          title: "Price vs Charging Decision (48h)"
          show_states: false
        graph_span: 48h
        apex_config:
          legend:
            show: true
        yaxis:
          - id: pct
            min: 0
            max: 100
            decimals: 0
            apex_config:
              title:
                text: "%"
          - id: price
            opposite: true
            decimals: 0
            apex_config:
              title:
                text: ct/kWh
        series:
          - entity: sensor.tibber_energy_prices
            name: Price
            yaxis_id: price
            color: '#2196F3'
            curve: stepline
            stroke_width: 2
            transform: return x * 100;
          - entity: sensor.batterie_soc
            name: Battery SoC
            yaxis_id: pct
            color: '#4CAF50'
            stroke_width: 2
          - entity: sensor.computed_target_soc
            name: Smart Target
            yaxis_id: pct
            color: '#9C27B0'
            curve: stepline
            stroke_width: 1
            stroke_dash: 4
          - entity: input_boolean.battery_charging_active
            name: Charging Active
            yaxis_id: pct
            color: '#FF9800'
            type: area
            curve: stepline
            opacity: 0.15
            stroke_width: 0
            transform: "return x === 'on' ? 100 : 0;"
          - entity: input_boolean.battery_no_discharging_active
            name: Discharge Limited
            yaxis_id: pct
            color: '#F44336'
            type: area
            curve: stepline
            opacity: 0.1
            stroke_width: 0
            transform: "return x === 'on' ? 100 : 0;"

      # --- PROFITABILITY ---
      - type: history-graph
        title: "Profitability Factors (24h)"
        hours_to_show: 24
        entities:
          - entity: sensor.tibber_energy_prices
            name: Current Price
          - entity: sensor.tibber_energy_average_price_next_12_hours
            name: Avg Price (12h)
          - entity: sensor.tibber_energy_highest_price_next_24_hours
            name: Max Price (24h)
          - entity: sensor.tibber_energy_price_percentile_next_12_hours
            name: Price Percentile

      # --- SOLAR IMPACT ---
      - type: history-graph
        title: "Solar Forecast Impact (24h)"
        hours_to_show: 24
        entities:
          - entity: sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute
            name: Solar Remaining
          - entity: binary_sensor.expected_sun_low
            name: Low Sun Flag
          - entity: binary_sensor.expected_sun_very_low
            name: Very Low Sun Flag

      # --- WALLBOX ---
      - type: entities
        title: "🚗 Wallbox & Car"
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.wattpilot_carconnected
            name: Status
          - entity: select.wattpilot_charging_mode
            name: Mode
          - entity: sensor.wallbox_power
            name: Charging Power
          - entity: input_boolean.battery_no_discharging_active
            name: Discharge Limited (Car)
          - type: divider
          - type: section
            label: Smart Charging
          - entity: input_boolean.car_smart_charging_on
            name: Smart Charging Enabled
          - entity: sensor.car_boost_energy_budget
            name: Lendable from home battery now
          - entity: binary_sensor.car_boost_viable
            name: Boost would start / keep running
          - entity: input_boolean.car_boost_active
            name: Solar Boost running
          - entity: binary_sensor.car_cheap_grid_window
            name: Grid price cheap enough
          - entity: input_boolean.car_cheap_grid_active
            name: Cheap-grid charging running
          - entity: input_boolean.car_boost_suppressed
            name: Boost paused (car took no power — replug clears)
          - type: divider
          - type: section
            label: "Grid / Inselbetrieb"
          - entity: binary_sensor.grid_available
            name: Grid available
          - entity: sensor.grid_frequency
            name: Grid frequency (island ≈ 53 Hz)

      # --- CAR SMART CHARGING DECISION (only shown while the car is plugged in) ---
      - type: conditional
        conditions:
          - entity: binary_sensor.wattpilot_33175380_stecker
            state: "on"
        card:
          type: markdown
          title: "☀️ Car Boost Decision Detail"
          content: |
            {% set data = state_attr('sensor.car_boost_energy_budget', 'calculation_data') %}
            {% if data %}
            **Budget:** {{ states('sensor.car_boost_energy_budget') }} Wh &nbsp; | &nbsp;
            **Floor:** {{ state_attr('sensor.car_boost_energy_budget', 'floor_soc') }}% &nbsp; | &nbsp;
            **Viable:** {{ states('binary_sensor.car_boost_viable') }}

            **Reason:** {{ data.decision_reason }}

            ### Budget Constraints (minimum wins)
            | Constraint | Value |
            |-----------|-------|
            | 1 — Battery above floor | {{ data.constraint_floor_wh }} Wh |
            | 2 — Tonight still covered | {{ data.constraint_overnight_wh }} Wh |
            | 3 — Sun can refill the loan | {{ data.constraint_solar_wh }} Wh |

            ### Inputs
            | Parameter | Value |
            |-----------|-------|
            | Battery SoC | {{ data.soc }}% |
            | Solar remaining today | {{ data.remaining_solar_wh }} Wh |
            | Usable (× confidence) | {{ data.usable_solar_wh }} Wh |
            | House until sunset | {{ data.house_until_sunset_wh }} Wh |
            | Solar surplus | {{ data.solar_surplus_wh }} Wh |
            | Needed at sunset | {{ data.needed_at_sunset_wh }} Wh |
            {% else %}
            *Waiting for data...*
            {% endif %}

  # =========================================================================
  # VIEW 5: MONITORING — Historical graphs
  # =========================================================================
  - title: Monitoring
    path: monitoring
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: "🔋 Battery SoC (24h)"
        hours_to_show: 24
        entities:
          - entity: sensor.batterie_soc
            name: Battery SoC
          - entity: input_number.battery_target_soc
            name: Target SoC
          - entity: sensor.computed_target_soc
            name: Smart Target

      - type: history-graph
